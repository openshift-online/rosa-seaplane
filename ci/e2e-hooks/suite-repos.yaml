# =============================================================================
# E2E suite pin registry — single source of truth for "which commit of each
# suite repo is deployed".
#
# Consumed by:
#   - scripts/check_e2e_pins.py (ci/check-e2e-pins.sh) — presubmit enforcing
#     the pin rules below
#   - the rosa-hyperfleet-e2e-env step (ROSAENG-75288) — resolves suite repo
#     checkouts for the parallel e2e runner
#
# Pin rules (enforced by check-e2e-pins):
#   P1 resolved like the deployment: config keys are read from the rendered
#      deploy/<env>/<region>/_merged_config.yaml; ArgoCD values are the base
#      values.yaml overlaid by deploy/<env>/<region>/argocd-values-*.yaml
#      (env layer wins).
#   P2 newest-pin-wins: a pin may only be bumped to a commit that is a
#      descendant of the previous value (single line of history).
#      Multiple pins of the same suite may bump together (they share a
#      repo, so ancestry is checked per pin).  Pins with an explicit
#      `bump_together: <group>` MUST move together: if one member bumps,
#      all members must bump in the same change (e.g. zoa's
#      lambda/runner/boundary images, built from one commit).
#   P3 full 40-char SHAs (optionally @sha256:<digest>). Short tags and branch
#      names fail the check — unless an entry sets `enforce: false`, which
#      reports a warning instead. Use temporarily for legacy pins and remove
#      as soon as they are re-pinned.
# =============================================================================

suites:
  api:
    repo: https://github.com/openshift-online/rosa-seaplane-api.git
    pins:
      - name: platform-api-image-tag
        doc: Container image tag of the platform-api deployment (SHA or
          SHA@sha256:<digest> form, as produced by Konflux).
        source:
          file: argocd/config/regional-cluster/platform-api/values.yaml
          key: platformApi.app.image.tag
      - name: seaplane-operator-chart-revision
        doc: ArgoCD Application targetRevision of the seaplane-operator chart.
        source:
          file: argocd/config/regional-cluster/hyperfleet/values.yaml
          key: seaplane.source.targetRevision
      - name: seaplane-operator-image-tag
        doc: Container image tag of the seaplane-operator deployment (SHA or
          SHA@sha256:<digest> form, as produced by Konflux).
        source:
          file: argocd/config/regional-cluster/hyperfleet/values.yaml
          key: seaplane.helmValues.image.tag

  zoa:
    repo: https://github.com/openshift-online/rosa-seaplane-zoa.git
    pins:
      # The three zoa images are built from one commit and bumped together;
      # bump_together lets the P2 rule accept the coordinated update (the
      # commit ancestry check still applies to each image tag).
      - name: zoa-lambda-image-tag
        doc: ZOA Lambda image tag (all three zoa images are bumped together).
        bump_together: zoa-images
        source:
          file: config/defaults.yaml
          key: regional_cluster.zoa_lambda_image_tag
        # TODO: "43aeef8" is a short Konflux build tag that is not a git
        # commit prefix — re-pin with a full-SHA-tagged build and remove
        # enforce: false.
        enforce: false
      - name: zoa-runner-image-tag
        doc: ZOA Runner image tag.
        bump_together: zoa-images
        source:
          file: config/defaults.yaml
          key: regional_cluster.zoa_runner_image_tag
        enforce: false # TODO: same as zoa-lambda-image-tag
      - name: zoa-boundary-image-tag
        doc: ZOA Boundary (ECS) image tag.
        bump_together: zoa-images
        source:
          file: config/defaults.yaml
          key: regional_cluster.zoa_boundary_image_tag
        enforce: false # TODO: same as zoa-lambda-image-tag

  # rosa-cli is intentionally NOT registered here: it is a test tool,
  # not a deployed component, and its checkout branch (seaplane-v2) is
  # not a SHA — ancestry and format checks are meaningless.  The suite
  # gets its repo/branch from ROSA_REPO_BRANCH set in the entry point
  # script or via E2E_SUITE_ENV.
