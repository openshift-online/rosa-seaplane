# =============================================================================
# Global defaults — inherited by all environments and regions.
#
# Inheritance chain:
#   defaults.yaml → <env>/defaults.yaml → <env>/<region>.yaml
#
# All string values support Jinja2 templating. The following variables are
# injected automatically by render.py:
#   {{ environment }}      — environment directory name (e.g. "integration")
#   {{ deployment_name }}  — logical deployment identifier (see deployment_name below)
#   {{ aws_region }}       — AWS region, always the config file stem (e.g. "us-east-1")
#   {{ cluster_prefix }}   — management_cluster key (e.g. "mc01")
#
# Documentation: @doc and @used-by annotations (validated by: render.py --check-docs)
# =============================================================================

git:
  # @doc git.revision ArgoCD ApplicationSet chart + generator revision. Commit hash to pin, "main" for HEAD.
  # @used-by git.revision _context
  revision: main
  # @doc git.bootstrap_revision Pipeline provisioner bootstrap revision.
  # @used-by git.bootstrap_revision _context
  bootstrap_revision: main

# @doc deployment_name Logical deployment identifier. Equals aws_region for normal deployments; override in ephemeral/CI to disambiguate multiple deployments in the same region (e.g. "us-east-1-xg4y"). Used for DNS zone naming and resource identification.
# @used-by deployment_name _context
# @used-by deployment_name pipeline-management-cluster-inputs/terraform.json.j2
# @used-by deployment_name pipeline-regional-cluster-inputs/terraform.json.j2
deployment_name: "{{ aws_region }}"

aws:
  # @doc aws.account_id Regional AWS account ID.
  # @used-by aws.account_id _context
  account_id: "ssm:///infra/{{ environment }}/{{ aws_region }}/account_id"
  # @doc aws.management_cluster_account_id Default account for MCs when entry has no account_id.
  # @used-by aws.management_cluster_account_id _context
  management_cluster_account_id: "ssm:///infra/{{ environment }}/{{ aws_region }}/{{ cluster_prefix }}/account_id"
  # @doc aws.child_admin_role_name Name of the IAM role the pipelines assume in RC/MC child accounts for state-bucket bootstrap (hop 1) and infra apply (hop 2). Defaults to the AWS Organizations role; override per environment to use a scoped day-2 role.
  # @used-by aws.child_admin_role_name _context
  child_admin_role_name: "OrganizationAccountAccessRole"
  # @doc aws.zoa_access_trusted_assumer_role_names Full IAM role names in the Central Account allowed to assume ZOA Access invoker roles in RC (exact string as in IAM, e.g. OrganizationAccountAccessRole). Optional in defaults; environments with ZOA Access set at least one name or suffix. IAM requires each principal to exist in central at RC apply.
  # @used-by aws.zoa_access_trusted_assumer_role_names _context
  zoa_access_trusted_assumer_role_names: []
  # @doc aws.zoa_access_trusted_assumer_role_name_suffixes Suffix only (app-interface access role name field), not the full IAM role name. App-interface SAML roles in central are created as "<central_account_id>-<suffix>" so the account ID must not be hardcoded in git; RC Terraform prefixes each suffix with the central account ID from the aws.central provider at apply time. Optional in defaults; at least one name or suffix required per environment at apply. Only list suffixes for roles that exist in that environment's central account.
  # @used-by aws.zoa_access_trusted_assumer_role_name_suffixes _context
  zoa_access_trusted_assumer_role_name_suffixes: []

# @doc image_registry_account_id AWS account ID that owns the private image registry. Stored as a central-account SSM parameter so RC and MC ArgoCD clusters use the same registry account.
# @used-by image_registry_account_id pipeline-management-cluster-inputs/terraform.json.j2
# @used-by image_registry_account_id pipeline-regional-cluster-inputs/terraform.json.j2
image_registry_account_id: "ssm:///infra/image-registry/account_id"

dns:
  # @doc dns.domain Base domain for the environment. Must be set per environment. See config/ephemeral/defaults.yaml for how the ephemeral template selects between CI and dev account pools.
  # @used-by dns.domain pipeline-provisioner-inputs/terraform.json.j2
  # @used-by dns.domain pipeline-regional-cluster-inputs/terraform.json.j2
  domain: ""
  # @doc dns.create_environment_zone Create the environment hosted zone in the central account. Set false to reuse an existing zone with pre-configured delegation.
  # @used-by dns.create_environment_zone pipeline-provisioner-inputs/terraform.json.j2
  create_environment_zone: false

terraform_tags:
  # @doc terraform_tags.app_code Application code for cost tagging.
  # @used-by terraform_tags.app_code pipeline-management-cluster-inputs/terraform.json.j2
  # @used-by terraform_tags.app_code pipeline-regional-cluster-inputs/terraform.json.j2
  app_code: "infra"
  # @doc terraform_tags.service_phase Service deployment phase.
  # @used-by terraform_tags.service_phase pipeline-management-cluster-inputs/terraform.json.j2
  # @used-by terraform_tags.service_phase pipeline-regional-cluster-inputs/terraform.json.j2
  service_phase: "dev"
  # @doc terraform_tags.cost_center Cost center code for billing.
  # @used-by terraform_tags.cost_center pipeline-management-cluster-inputs/terraform.json.j2
  # @used-by terraform_tags.cost_center pipeline-regional-cluster-inputs/terraform.json.j2
  cost_center: "000"

# @doc worker_node_ami Pin a specific AMI for all worker nodes across both regional and management clusters. Drives both the Karpenter EC2NodeClass and the Terraform bootstrap node group. Null uses the default bottlerocket FIPS name selector (Karpenter) and the EKS-optimized AL2023 AMI (bootstrap group). When set, both family and id must be provided together (e.g. {family: AL2023, id: ami-0abc123}).
# @used-by worker_node_ami _context
# @used-by worker_node_ami pipeline-management-cluster-inputs/terraform.json.j2
# @used-by worker_node_ami pipeline-regional-cluster-inputs/terraform.json.j2
worker_node_ami: null

# @doc worker_node_root_volume_size Root EBS volume size (GiB) for worker nodes. Drives both the Karpenter EC2NodeClass and the Terraform bootstrap node group.
# @used-by worker_node_root_volume_size _context
# @used-by worker_node_root_volume_size pipeline-management-cluster-inputs/terraform.json.j2
# @used-by worker_node_root_volume_size pipeline-regional-cluster-inputs/terraform.json.j2
worker_node_root_volume_size: 50

regional_cluster:
  # @doc regional_cluster.enable_bastion Enable bastion host for regional cluster access.
  # @used-by regional_cluster.enable_bastion pipeline-regional-cluster-inputs/terraform.json.j2
  enable_bastion: false
  # @doc regional_cluster.enable_cloudtrail Enable CloudTrail audit logging (FedRAMP AU-12). Off by default; enable for environments requiring compliance.
  # @used-by regional_cluster.enable_cloudtrail pipeline-regional-cluster-inputs/terraform.json.j2
  enable_cloudtrail: false
  # @doc regional_cluster.enable_api_custom_domain Enable API Gateway custom domain and ACM certificate. Off by default; adds ~20 minutes for certificate validation.
  # @used-by regional_cluster.enable_api_custom_domain pipeline-regional-cluster-inputs/terraform.json.j2
  enable_api_custom_domain: false
  # @doc regional_cluster.enable_rate_limit_redis Enable ElastiCache Redis for Platform API rate limiting.
  # @used-by regional_cluster.enable_rate_limit_redis pipeline-regional-cluster-inputs/terraform.json.j2
  enable_rate_limit_redis: true
  # @doc regional_cluster.enable_write_sre_tools Enable write/admin access to SRE tools (Grafana, ArgoCD). Off by default. Can only be set to true for ephemeral environments — render.py enforces this.
  # @used-by regional_cluster.enable_write_sre_tools _context
  enable_write_sre_tools: false
  # @doc regional_cluster.zone_shard_count Number of DNS zone shards under the regional zone. Each shard supports ~10k records.
  # @used-by regional_cluster.zone_shard_count pipeline-regional-cluster-inputs/terraform.json.j2
  zone_shard_count: 1
  # @doc regional_cluster.node_instance_families EC2 instance families for regional cluster Karpenter NodePool (e.g. m8i, m7i). Sizes are generated by the eks-nodepool Helm chart.
  # @used-by regional_cluster.node_instance_families _context
  node_instance_families: ["m8i", "m7i"]
  # @doc regional_cluster.seaplane_db_instance_class Aurora instance class for Seaplane DB.
  # @used-by regional_cluster.seaplane_db_instance_class pipeline-regional-cluster-inputs/terraform.json.j2
  seaplane_db_instance_class: "db.r6g.large"
  # @doc regional_cluster.seaplane_db_deletion_protection Enable deletion protection for Seaplane DB Aurora cluster.
  # @used-by regional_cluster.seaplane_db_deletion_protection pipeline-regional-cluster-inputs/terraform.json.j2
  seaplane_db_deletion_protection: true
  # @doc regional_cluster.seaplane_db_skip_final_snapshot Skip final snapshot when destroying Seaplane DB (ephemeral only).
  # @used-by regional_cluster.seaplane_db_skip_final_snapshot pipeline-regional-cluster-inputs/terraform.json.j2
  seaplane_db_skip_final_snapshot: false
  # @doc regional_cluster.seaplane_db_performance_insights_enabled Enable Performance Insights for Seaplane DB Aurora.
  # @used-by regional_cluster.seaplane_db_performance_insights_enabled pipeline-regional-cluster-inputs/terraform.json.j2
  seaplane_db_performance_insights_enabled: true
  # @doc regional_cluster.seaplane_db_monitoring_interval Enhanced Monitoring interval in seconds for Seaplane DB Aurora (0 to disable).
  # @used-by regional_cluster.seaplane_db_monitoring_interval pipeline-regional-cluster-inputs/terraform.json.j2
  seaplane_db_monitoring_interval: 60
  # @doc regional_cluster.enable_sre_tools_gateway Enable internal ALB for SRE UI tools (Grafana, ArgoCD, Prometheus, Thanos, Loki). Requires dns.domain to be set for DNS/TLS.
  # @used-by regional_cluster.enable_sre_tools_gateway _context
  # @used-by regional_cluster.enable_sre_tools_gateway pipeline-regional-cluster-inputs/terraform.json.j2
  enable_sre_tools_gateway: false
  # @doc regional_cluster.enable_sre_public_access When true, the SRE UI ALB is internet-facing. Combine with sre_allowed_source_cidrs to restrict access to known CIDRs.
  # @used-by regional_cluster.enable_sre_public_access pipeline-regional-cluster-inputs/terraform.json.j2
  enable_sre_public_access: false
  # @doc regional_cluster.sre_allowed_source_cidrs Source IP CIDRs allowed to reach the SRE UI ALB when enable_sre_public_access is true. Leave empty in config — the buildspec fetches the actual list from SSM (/infra/sre-ui-alb/allowed-source-cidrs in the RC account) at pipeline time.
  # @used-by regional_cluster.sre_allowed_source_cidrs pipeline-regional-cluster-inputs/terraform.json.j2
  sre_allowed_source_cidrs: []
  # @doc regional_cluster.enable_sre_oidc_auth When true, ALB listener rules require OIDC authentication via Red Hat SSO. Requires per-service client IDs in config and client secrets in Secrets Manager (sre-ui-alb/{service}/oidc-client-secret).
  # @used-by regional_cluster.enable_sre_oidc_auth pipeline-regional-cluster-inputs/terraform.json.j2
  enable_sre_oidc_auth: false
  # @doc regional_cluster.sre_oidc_issuer_url OIDC issuer base URL for the SRE UI ALB. Authorization, token, and userinfo endpoints are derived from this. Defaults to Red Hat SSO EmployeeIDP.
  # @used-by regional_cluster.sre_oidc_issuer_url pipeline-regional-cluster-inputs/terraform.json.j2
  sre_oidc_issuer_url: "https://auth.redhat.com/auth/realms/EmployeeIDP"
  # @doc regional_cluster.sre_grafana_oidc_client_id OIDC client ID for Grafana. Required when enable_sre_oidc_auth is true.
  # @used-by regional_cluster.sre_grafana_oidc_client_id pipeline-regional-cluster-inputs/terraform.json.j2
  sre_grafana_oidc_client_id: ""
  # @doc regional_cluster.sre_argocd_oidc_client_id OIDC client ID for ArgoCD. Required when enable_sre_oidc_auth is true.
  # @used-by regional_cluster.sre_argocd_oidc_client_id pipeline-regional-cluster-inputs/terraform.json.j2
  sre_argocd_oidc_client_id: ""
  # @doc regional_cluster.sre_prometheus_oidc_client_id OIDC client ID for Prometheus. Required when enable_sre_oidc_auth is true.
  # @used-by regional_cluster.sre_prometheus_oidc_client_id pipeline-regional-cluster-inputs/terraform.json.j2
  sre_prometheus_oidc_client_id: ""
  # @doc regional_cluster.sre_thanos_oidc_client_id OIDC client ID for Thanos. Required when enable_sre_oidc_auth is true.
  # @used-by regional_cluster.sre_thanos_oidc_client_id pipeline-regional-cluster-inputs/terraform.json.j2
  sre_thanos_oidc_client_id: ""
  # @doc regional_cluster.zoa_lambda_image_tag Immutable tag for the ZOA Lambda image. Defaults to a known-good Konflux on-push build. Override via --provision-override-file for ephemeral e2e with a CI-built tag (e.g. ci-<PR>-<BUILD_ID>).
  # @used-by regional_cluster.zoa_lambda_image_tag pipeline-management-cluster-inputs/terraform.json.j2
  # @used-by regional_cluster.zoa_lambda_image_tag pipeline-regional-cluster-inputs/terraform.json.j2
  zoa_lambda_image_tag: "f8fb152"
  # @doc regional_cluster.zoa_runner_image_tag Immutable tag for the ZOA Runner image. Defaults to same Konflux build as Lambda. Override independently when testing a new runner with the current Lambda (or vice versa).
  # @used-by regional_cluster.zoa_runner_image_tag pipeline-management-cluster-inputs/terraform.json.j2
  # @used-by regional_cluster.zoa_runner_image_tag pipeline-regional-cluster-inputs/terraform.json.j2
  zoa_runner_image_tag: "f8fb152"
  # @doc regional_cluster.zoa_lambda_source_image Source registry image for the ZOA Lambda (mirrored to ECR at deploy time). Override together with zoa_lambda_image_tag when pointing at a fork or CI registry (e.g. quay.io/rrp-dev-ci/zoa-lambda).
  # @used-by regional_cluster.zoa_lambda_source_image pipeline-regional-cluster-inputs/terraform.json.j2
  zoa_lambda_source_image: "quay.io/rrp-dev-ci/zoa-lambda"
  # @doc regional_cluster.zoa_runner_source_image Source registry image for the ZOA Runner (pulled directly by K8s, no ECR mirror). Override together with zoa_runner_image_tag when pointing at a fork or CI registry.
  # @used-by regional_cluster.zoa_runner_source_image pipeline-management-cluster-inputs/terraform.json.j2
  # @used-by regional_cluster.zoa_runner_source_image pipeline-regional-cluster-inputs/terraform.json.j2
  zoa_runner_source_image: "quay.io/rrp-dev-ci/zoa-runner"
  # @doc regional_cluster.zoa_boundary_image_tag Immutable tag for the ZOA Boundary ECS image. Required; same commit tag as Lambda/Runner when bumped together.
  # @used-by regional_cluster.zoa_boundary_image_tag pipeline-management-cluster-inputs/terraform.json.j2
  # @used-by regional_cluster.zoa_boundary_image_tag pipeline-regional-cluster-inputs/terraform.json.j2
  zoa_boundary_image_tag: "f8fb152"
  # @doc regional_cluster.zoa_boundary_source_image Source registry image for ZOA Boundary (pulled directly by ECS). Override together with zoa_boundary_image_tag when pointing at a fork or CI registry.
  # @used-by regional_cluster.zoa_boundary_source_image pipeline-management-cluster-inputs/terraform.json.j2
  # @used-by regional_cluster.zoa_boundary_source_image pipeline-regional-cluster-inputs/terraform.json.j2
  zoa_boundary_source_image: "quay.io/rrp-dev-ci/zoa-boundary"
  # @doc regional_cluster.zoa_boundary_session_idle_timeout_seconds Terminal inactivity (seconds) before the boundary reaper stops a session. Wired to RC zoa-lambda (worker reaper) and zoa-access (RunTask MOTD); MC zoa-lambda uses the same value for MC-target reaping.
  # @used-by regional_cluster.zoa_boundary_session_idle_timeout_seconds pipeline-regional-cluster-inputs/terraform.json.j2
  # @used-by regional_cluster.zoa_boundary_session_idle_timeout_seconds pipeline-management-cluster-inputs/terraform.json.j2
  zoa_boundary_session_idle_timeout_seconds: 3600
  # @doc regional_cluster.zoa_boundary_session_stale_creating_seconds Max seconds a session may stay in creating before the worker reaper terminates it (SESSION_STALE_CREATING_SECONDS on zoa-lambda worker).
  # @used-by regional_cluster.zoa_boundary_session_stale_creating_seconds pipeline-regional-cluster-inputs/terraform.json.j2
  # @used-by regional_cluster.zoa_boundary_session_stale_creating_seconds pipeline-management-cluster-inputs/terraform.json.j2
  zoa_boundary_session_stale_creating_seconds: 900
  # @doc regional_cluster.zoa_boundary_session_max_duration_hours Default/max boundary session length (hours). RC zoa-access only (deadline in Dynamo + ZOA_SESSION_DEADLINE on task).
  # @used-by regional_cluster.zoa_boundary_session_max_duration_hours pipeline-regional-cluster-inputs/terraform.json.j2
  zoa_boundary_session_max_duration_hours: 4
  # Fleet defaults for ZOA Lambda reserved concurrency (SSOT for deploy). Ephemeral overrides in config/ephemeral/defaults.yaml only.
  # Module defaults in terraform/modules/zoa-lambda|zoa-access should match these unless a stack omits TF_VAR (local module tests).
  # @doc regional_cluster.zoa_lambda_api_concurrency Reserved concurrency for ZOA API Lambda (-1 = unreserved account pool per Terraform aws_lambda_function). Ephemeral: -1 — see config/ephemeral/.
  # @used-by regional_cluster.zoa_lambda_api_concurrency pipeline-regional-cluster-inputs/terraform.json.j2
  # @used-by regional_cluster.zoa_lambda_api_concurrency pipeline-management-cluster-inputs/terraform.json.j2
  zoa_lambda_api_concurrency: 50
  # @doc regional_cluster.zoa_lambda_worker_concurrency Reserved concurrency for ZOA Worker Lambda (-1 = unreserved). Ephemeral uses -1 for all ZOA Lambdas — see config/ephemeral/.
  # @used-by regional_cluster.zoa_lambda_worker_concurrency pipeline-regional-cluster-inputs/terraform.json.j2
  # @used-by regional_cluster.zoa_lambda_worker_concurrency pipeline-management-cluster-inputs/terraform.json.j2
  zoa_lambda_worker_concurrency: 10
  # @doc regional_cluster.zoa_lambda_access_concurrency Reserved concurrency for ZOA Access Lambda on RC only (-1 = unreserved, or >= 1 reserved). Ephemeral: -1 — see config/ephemeral/.
  # @used-by regional_cluster.zoa_lambda_access_concurrency pipeline-regional-cluster-inputs/terraform.json.j2
  zoa_lambda_access_concurrency: 10

management_cluster_defaults:
  # @doc management_cluster_defaults.enable_bastion Default enable bastion for management clusters.
  # @used-by management_cluster_defaults.enable_bastion _context
  # @used-by management_cluster_defaults.enable_bastion pipeline-management-cluster-inputs/terraform.json.j2
  enable_bastion: false
  # @doc management_cluster_defaults.node_instance_families Default EC2 instance families for MC Karpenter NodePool (e.g. m8i, m7i). Sizes are generated by the eks-nodepool Helm chart.
  # @used-by management_cluster_defaults.node_instance_families _context
  node_instance_families: ["m8i", "m7i"]

observability:
  pagerduty:
    # @doc observability.pagerduty.enabled Enable PagerDuty service provisioning for the region.
    # @used-by observability.pagerduty.enabled _context
    # @used-by observability.pagerduty.enabled pipeline-regional-cluster-inputs/terraform.json.j2
    enabled: false
    # @doc observability.pagerduty.escalation_policy_id PagerDuty escalation policy ID for regional services.
    # @used-by observability.pagerduty.escalation_policy_id _context
    # @used-by observability.pagerduty.escalation_policy_id pipeline-regional-cluster-inputs/terraform.json.j2
    escalation_policy_id: "P5KE444"

  sns_alerting:
    # @doc observability.sns_alerting.enabled Enable SNS alerting for regional cluster alert consumption by automated/external services.
    # @used-by observability.sns_alerting.enabled _context
    # @used-by observability.sns_alerting.enabled pipeline-regional-cluster-inputs/terraform.json.j2
    enabled: true

cluster_lifecycle:
  # @doc cluster_lifecycle.default_expiration Auto-delete clusters this long after creation when the create request omits spec.expirationTimestamp. Go duration (e.g. "24h"). Empty disables it (flag omitted). Wired into platform-api via applications.regional-cluster.platformApi.
  # @used-by cluster_lifecycle.default_expiration _context
  default_expiration: ""

applications:
  management-cluster:
    eksNodePool:
      # @doc applications.management-cluster.eksNodePool.instanceFamilies Instance families for the MC Karpenter NodePool.
      # @used-by applications.management-cluster.eksNodePool.instanceFamilies _context
      instanceFamilies: "{{ management_cluster_defaults.node_instance_families }}"
      # @doc applications.management-cluster.eksNodePool.ami Pinned AMI for the MC Karpenter EC2NodeClass ({family, id}). Null uses the default bottlerocket FIPS name selector.
      # @used-by applications.management-cluster.eksNodePool.ami _context
      ami: "{{ worker_node_ami }}"
      # @doc applications.management-cluster.eksNodePool.rootVolumeSize Root volume size for the MC Karpenter EC2NodeClass when a custom AMI is pinned. Only applied on the custom-AMI path.
      # @used-by applications.management-cluster.eksNodePool.rootVolumeSize _context
      rootVolumeSize: "{{ worker_node_root_volume_size }}Gi"
    hypershift:
      oidcStorageS3Bucket:
        # @doc applications.management-cluster.hypershift.oidcStorageS3Bucket.name OIDC S3 bucket name for HyperShift.
        # @used-by applications.management-cluster.hypershift.oidcStorageS3Bucket.name _context
        name: "hypershift-mc-{{ aws_region }}"
        # @doc applications.management-cluster.hypershift.oidcStorageS3Bucket.region OIDC S3 bucket region.
        # @used-by applications.management-cluster.hypershift.oidcStorageS3Bucket.region _context
        region: "{{ aws_region }}"
      externalDns:
        # @doc applications.management-cluster.hypershift.externalDns.domain External DNS domain filter for HyperShift. Should match the regional zone so external-dns discovers zone shards.
        # @used-by applications.management-cluster.hypershift.externalDns.domain _context
        domain: "{% if dns.domain %}{{ deployment_name }}.{{ dns.domain }}{% endif %}"
  regional-cluster:
    eksNodePool:
      # @doc applications.regional-cluster.eksNodePool.instanceFamilies Instance families for the regional Karpenter NodePool.
      # @used-by applications.regional-cluster.eksNodePool.instanceFamilies _context
      instanceFamilies: "{{ regional_cluster.node_instance_families }}"
      # @doc applications.regional-cluster.eksNodePool.ami Pinned AMI for the regional Karpenter EC2NodeClass ({family, id}). Null uses the default bottlerocket FIPS name selector.
      # @used-by applications.regional-cluster.eksNodePool.ami _context
      ami: "{{ worker_node_ami }}"
      # @doc applications.regional-cluster.eksNodePool.rootVolumeSize Root volume size for the regional Karpenter EC2NodeClass when a custom AMI is pinned. Only applied on the custom-AMI path.
      # @used-by applications.regional-cluster.eksNodePool.rootVolumeSize _context
      rootVolumeSize: "{{ worker_node_root_volume_size }}Gi"
    # @doc applications.regional-cluster.baseDomain DNS base domain for HostedClusters (deployment_name.dns.domain).
    # @used-by applications.regional-cluster.baseDomain _context
    baseDomain: "{% if dns.domain %}{{ deployment_name }}.{{ dns.domain }}{% endif %}"
    platformApi:
      authz:
        # @doc applications.regional-cluster.platformApi.authz.config Complete serialized v1 authorization bundle. Enrolls the RC account (@@AWS_ACCOUNT_ID@@, resolved by Helm) and grants the identities behind rrp-rc (the child-admin role; CI's e2e user) AllActions on the RC account's own resources, except the authz deny probe. Customer accounts are allowlisted at runtime. Overrides replace the entire bundle.
        # @used-by applications.regional-cluster.platformApi.authz.config _context
        config: |
          formatVersion: 1
          registeredAccounts: ["@@AWS_ACCOUNT_ID@@"]
          policies:
            - id: rc-all-actions
              ownerAccountID: "@@AWS_ACCOUNT_ID@@"
              content: |
                permit(principal, action in Seaplane::Action::"AllActions", resource)
                when { context.accountId == "@@AWS_ACCOUNT_ID@@" }
                unless { context.requestLabels.hasTag("authz-deny-probe") };
          attachments:
            - id: rc-child-admin
              policyID: rc-all-actions
              principalARN: arn:aws:iam::@@AWS_ACCOUNT_ID@@:role/{{ aws.child_admin_role_name }}
              scope: global
            - id: rc-e2e-user
              policyID: rc-all-actions
              principalARN: arn:aws:iam::@@AWS_ACCOUNT_ID@@:user/e2e
              scope: global
      app:
        args:
          # @doc applications.regional-cluster.platformApi.app.args.defaultClusterExpiration Maps cluster_lifecycle.default_expiration into the platform-api --default-cluster-expiration flag.
          # @used-by applications.regional-cluster.platformApi.app.args.defaultClusterExpiration _context
          defaultClusterExpiration: "{{ cluster_lifecycle.default_expiration }}"
    seaplane:
      # @doc applications.regional-cluster.seaplane.oidcS3Bucket S3 bucket name the Seaplane Operator writes OIDC discovery documents to.
      # @used-by applications.regional-cluster.seaplane.oidcS3Bucket _context
      # NOTE: This value is overridden in the ApplicationSet valuesObject (config/templates/argocd-bootstrap/applicationset.yaml.j2)
      # with the actual bucket name from terraform output (oidc_bucket_name), threaded through cluster secret annotations.
      # The placeholder below is kept for documentation but is not used.
      oidcS3Bucket: "PLACEHOLDER-overridden-by-terraform-output"
    pagerduty:
      # @doc applications.regional-cluster.pagerduty.enabled Enable PagerDuty alerting in the monitoring stack.
      # @used-by applications.regional-cluster.pagerduty.enabled _context
      enabled: "{{ observability.pagerduty.enabled | default(false) }}"
    grafana:
      # @doc applications.regional-cluster.grafana Grafana auth mode driven by enable_write_sre_tools. Viewer when false (default), Admin when true (ephemeral only).
      # @used-by applications.regional-cluster.grafana _context
      "grafana.ini":
        "auth.anonymous":
          org_role: "{% if regional_cluster.enable_write_sre_tools %}Admin{% else %}Viewer{% endif %}"
        users:
          auto_assign_org_role: "{% if regional_cluster.enable_write_sre_tools %}Admin{% else %}Viewer{% endif %}"
    argo-cd:
      # @doc applications.regional-cluster.argo-cd ArgoCD RBAC mode driven by enable_write_sre_tools. Anonymous read-only when false (default); admin enabled with no restrictions when true (ephemeral only).
      # @used-by applications.regional-cluster.argo-cd _context
      configs:
        cm:
          admin.enabled: "{% if regional_cluster.enable_write_sre_tools %}true{% else %}false{% endif %}"
          users.anonymous.enabled: "{% if regional_cluster.enable_write_sre_tools %}false{% else %}true{% endif %}"
        rbac:
          policy.default: "{% if regional_cluster.enable_write_sre_tools %}{% else %}role:readonly{% endif %}"

