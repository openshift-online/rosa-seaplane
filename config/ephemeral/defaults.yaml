# Ephemeral environment template
#
# This is not a living environment — it is a template for short-lived
# environments used by CI e2e tests and developer workflows. A UUID
# (eph_prefix) is injected at render time to isolate each instance within
# shared CI or dev AWS accounts.
#
# DNS account pool selection:
#   Ephemeral environments run in two account pools with separate DNS:
#     - eph-dev accounts → eph-dev0.rosa.devshift.org  (local developer environments)
#     - eph-ci accounts  → eph-ci0.rosa.devshift.org   (CI e2e test environments)
#   The `ci` template variable (true when both EPH_PREFIX and BUILD_ID are
#   set) selects the correct pool. BUILD_ID is set by CI pipelines; when
#   rendering locally or during CI lint checks (no EPH_PREFIX), the default
#   eph-dev0 domain is used so rendered files match what is committed.

deployment_name: "{{ aws_region }}{% if eph_prefix %}-{{ eph_prefix }}{% endif %}"

aws:
  # ZOA Access invoker trust: who may assume the <deployment>-zoa-access-invoker role
  # in RC and call the ZOA Access Function URL. Two inputs, each a different kind of
  # principal, and both differ per pool (eph-dev vs eph-ci) — the regional-cluster
  # template substitutes the eph-ci values for ci renders:
  #
  #   zoa_access_trusted_assumer_role_names  (full IAM role names, used as-is)
  #     The CI/e2e caller. eph-ci: the central `rosa-seaplane-ci` role Prow assumes
  #     (set in the template's ci branch). eph-dev: empty — its callers are SAML
  #     roles, expressed as suffixes below.
  #
  #   zoa_access_trusted_assumer_role_name_suffixes  (app-interface SAML roles;
  #   RC prefixes each with the central account ID at apply, so no account ID in git)
  #     - rosa-seaplane-zoa-operator-<pool>: the ZOA operator role (human SRE break-glass).
  #     - rosa-hyperfleet-eph-dev-admin: eph-dev only — the control-admin role the
  #       local/e2e identity (rrp-central) runs as; eph-ci uses `rosa-seaplane-ci` instead.
  #
  # TODO: split eph-dev and eph-ci into separate env configs so these principals are
  # static per env, instead of swapping them via the `{% if ci %}` branch in the
  # regional-cluster template. The branch exists only because the two pools have
  # different principals AND each must already exist in that pool's central account at
  # apply time (IAM rejects a trust naming a nonexistent role) — so a single shared
  # list can't be valid for both. Once the envs are separate, drop the dynamic layering.
  zoa_access_trusted_assumer_role_name_suffixes:
    - rosa-seaplane-zoa-operator-eph-dev # human SRE break-glass (ZOA operator)
    - rosa-hyperfleet-eph-dev-admin # local/e2e caller (control-admin via SAML)

dns:
  domain: "{% if ci %}eph-ci0{% else %}eph-dev0{% endif %}.rosa.devshift.org"
  # Zone shard 0 and the dns-zone-operator role live in the dedicated DNS shard
  # account (minted by rosa-seaplane-internal via dns_zones in env.hcl). Requires
  # the account and its /infra/<region>/dns00/account_id SSM param to exist.
  shard0_account_id: "ssm:///infra/{{ aws_region }}/dns00/account_id"

regional_cluster:
  # Authz tables are created and destroyed with the ephemeral RC.
  enable_ephemeral_authz_tables: true
  enable_bastion: true
  enable_write_sre_tools: true
  node_instance_families: ["m8i-flex", "m7i-flex"]
  seaplane_db_instance_class: "db.t4g.medium"
  seaplane_db_deletion_protection: false
  zoa_dynamodb_deletion_protection: false
  seaplane_db_skip_final_snapshot: true
  seaplane_db_performance_insights_enabled: false
  seaplane_db_monitoring_interval: 0
  enable_sre_tools_gateway: true
  # Ephemeral accounts: use unreserved pool (-1) for all ZOA Lambdas. Do not use 0 (AWS/Terraform
  # disable the function). Avoid fleet reserves (50/10/10) so PutFunctionConcurrency does not exhaust quota.
  zoa_lambda_api_concurrency: -1
  zoa_lambda_worker_concurrency: -1
  zoa_lambda_access_concurrency: -1
  # ZOA container image tags live only in config/defaults.yaml. Do not duplicate them here:
  # render.py merges this file on top of global defaults (ephemeral wins on conflicts).
  # Ephemeral ZOA e2e (rosa-seaplane-zoa on-demand / rosa-hyperfleet-ephemeral-e2e) injects
  # PR-built Lambda, Runner, and Boundary images by deep-merging into config/defaults.yaml
  # during provision (--provision-override-file). Tags in this file would pin Konflux builds
  # and prevent testing rosa-seaplane-zoa PR images in CI.

applications:
  regional-cluster:
    seaplane:
      oidcS3Bucket: "hypershift-{{ eph_prefix }}-regional-oidc-{{ account_id }}"

management_cluster_defaults:
  enable_bastion: true
  node_instance_families: ["m8i-flex", "m7i-flex"]
