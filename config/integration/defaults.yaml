aws:
  # Pipelines assume this role in the RC/MC child accounts. The newly minted
  # Hyperfleet int accounts create rosa-seaplane-account-admin (via
  # rosa-seaplane-internal account-bootstrap-roles), which already trusts the
  # central codebuild roles, so pipelines use it instead of the Organizations role.
  child_admin_role_name: rosa-seaplane-account-admin
  zoa_access_trusted_assumer_role_names:
    - OrganizationAccountAccessRole
  # The ZOA operator SAML role is provisioned by app-interface on the new
  # Hyperfleet int central (rosa-hyperfleet-int-control); RC prefixes this suffix
  # with the central account ID at apply time.
  zoa_access_trusted_assumer_role_name_suffixes:
    - rosa-seaplane-zoa-operator-int

dns:
  domain: int0.rosa.devshift.org

# Pin a specific AMI for all worker nodes (RC + MC), covering both the Karpenter
# EC2NodeClass and the Terraform bootstrap node group. ami-056d5e72aa5cf51f1 is a
# RHEL EKS image bootstrapped via nodeadm. amiFamily AL2023: Karpenter generates
# the nodeadm NodeConfig itself, including apiServerEndpoint, certificateAuthority,
# and cidr. The image is nodeadm-compatible, so the AL2023-family bootstrap works
# on RHEL. (A name-only Custom NodeConfig fails: nodeadm hard-fails validation with
# "Apiserver endpoint is missing" rather than resolving it via eks:DescribeCluster.)
worker_node_ami:
  family: AL2023
  id: ami-056d5e72aa5cf51f1

regional_cluster:
  seaplane_db_deletion_protection: false
  zoa_dynamodb_deletion_protection: false
  enable_bastion: true
  enable_cloudtrail: true
  enable_api_custom_domain: true
  node_instance_families: ["m8i", "m7i"]
  enable_sre_tools_gateway: true
  enable_sre_public_access: true
  sre_allowed_source_cidrs: []
  enable_sre_oidc_auth: true
  sre_oidc_issuer_url: "https://auth.stage.redhat.com/auth/realms/EmployeeIDP"
  sre_grafana_oidc_client_id: "rrp-grafana-sre-int-us-east-1"
  sre_argocd_oidc_client_id: "rrp-argocd-sre-int-us-east-1"
  sre_prometheus_oidc_client_id: "rrp-prometheus-sre-int-us-east-1"
  sre_thanos_oidc_client_id: "rrp-thanos-sre-int-us-east-1"

cluster_lifecycle:
  default_expiration: "24h"

management_cluster_defaults:
  enable_bastion: true
  node_instance_families: ["m8i", "m7i"]

observability:
  pagerduty:
    enabled: false
