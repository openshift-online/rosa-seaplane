{{/*
Operator-managed operand ServiceAccounts. The thanos-community operator
accepts spec.imagePullSecrets on CRs but never copies them onto pods
(Options has no ImagePullSecrets field). Registry.redhat.io pulls fail
without these SA secrets. mutateServiceAccount only updates labels, so
imagePullSecrets survive operator reconcile. Apply before CRs (wave 0).
*/}}
{{- $ns := include "thanos-operator.namespace" . }}
{{- $sas := list }}
{{- if .Values.query.enabled }}
{{- $sas = concat $sas (list "thanos-query-thanos-query" "thanos-query-frontend-thanos-query") }}
{{- end }}
{{- if .Values.receive.enabled }}
{{- $sas = concat $sas (list "thanos-receive-router-thanos-receive" "thanos-receive-ingester-thanos-receive-default") }}
{{- end }}
{{- if .Values.storeGateway.enabled }}
{{- $sas = concat $sas (list "thanos-store-thanos-store") }}
{{- end }}
{{- if .Values.compactor.enabled }}
{{- $sas = concat $sas (list "thanos-compact-thanos-compact") }}
{{- end }}
{{- if .Values.ruler.enabled }}
{{- $sas = concat $sas (list "thanos-ruler-thanos-ruler") }}
{{- end }}
{{- range $sas }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ . }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: ServerSideApply=true
imagePullSecrets:
  - name: pull-secret
{{- end }}
