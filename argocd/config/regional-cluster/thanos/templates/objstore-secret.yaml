{{- if .Values.global.cluster_name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.objectStore.secretName }}
  namespace: {{ include "seaplane-thanos.namespace" . }}
  labels:
    {{- include "seaplane-thanos.labels" . | nindent 4 }}
  annotations:
    {{- include "seaplane-thanos.annotations" . | nindent 4 }}
type: Opaque
stringData:
  objstore.yml: |
    type: S3
    config:
      bucket: {{ printf "%s-thanos-metrics-%s" .Values.global.cluster_name .Values.global.aws_account_id | quote }}
      endpoint: {{ if hasPrefix "us-" .Values.global.aws_region }}{{ printf "s3-fips.%s.amazonaws.com" .Values.global.aws_region | quote }}{{ else }}{{ printf "s3.%s.amazonaws.com" .Values.global.aws_region | quote }}{{ end }}
      region: {{ .Values.global.aws_region | quote }}
      {{- if .Values.thanos.kmsKeyArn }}
      sse_config:
        type: "SSE-KMS"
        kms_key_id: {{ .Values.thanos.kmsKeyArn | quote }}
      {{- end }}
{{- end }}
