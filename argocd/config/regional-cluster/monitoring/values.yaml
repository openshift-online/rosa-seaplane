# registry.redhat.io requires the cluster pull secret (see templates/pull-secret.yaml).
# ApplicationSet already injects global.cluster_name / cluster_type; this merges.
global:
  imagePullSecrets:
    - name: pull-secret

pagerduty:
  enabled: false

# SRE UI ALB — injected at runtime by ApplicationSet; empty when ALB is not deployed
monitoring:
  sre:
    targetGroup:
      arn: ""

kube-prometheus-stack:
  nameOverride: "monitoring"
  namespaceOverride: "monitoring"
  global:
    imagePullSecrets:
      - name: pull-secret

  crds:
    enabled: true
    upgradeJob:
      enabled: true
      forceConflicts: true

  defaultRules:
    create: false

  alertmanager:
    enabled: true
    tplConfig: true
    config:
      route:
        # Default receiver drops alerts not matched by any route.
        # All real delivery happens via explicit routes with continue: true,
        # so alerts flow through every matching receiver (SNS, PagerDuty, etc.).
        receiver: "null"
        routes:
          - receiver: sns-alerts
            continue: true
          - receiver: pagerduty
            match_re:
              severity: "warning|critical"
            continue: true
      receivers:
        - name: "null"
        - name: sns-alerts
          sns_configs:
            - topic_arn: 'arn:aws:sns:{{ .Values.global.aws_region }}:{{ .Values.global.aws_account_id }}:{{ .Values.global.cluster_name }}-alerts'
              sigv4:
                region: '{{ .Values.global.aws_region }}'
              send_resolved: true
        - name: pagerduty
          pagerduty_configs:
            - routing_key_file: /etc/alertmanager/secrets/pagerduty-integration-key/integration_key
              severity: '{{ "{{" }} if .CommonLabels.severity {{ "}}" }}{{ "{{" }} .CommonLabels.severity {{ "}}" }}{{ "{{" }} else {{ "}}" }}critical{{ "{{" }} end {{ "}}" }}'
              send_resolved: true
    alertmanagerSpec:
      image:
        registry: registry.redhat.io
        repository: openshift4/ose-prometheus-alertmanager-rhel9
        tag: v4.20.0
        sha: d384ffd4977e0ffdf2aff5d8f8ea64b1b79b08b8fd543c8ce9b9d840fd134e22
      version: v0.28.1
      secrets:
        - pagerduty-integration-key
      replicas: 2
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
  grafana:
    enabled: false

  # CMO 4.20 images. kube-prometheus-stack sha fields are digest hex only
  # (templates prepend @sha256:). prometheusSpec.version is Prometheus
  # semver — CMO tags are OCP versions, not Prometheus versions.
  prometheusOperator:
    image:
      registry: registry.redhat.io
      repository: openshift4/ose-prometheus-rhel9-operator
      tag: v4.20.0
      sha: 7e5d688d1dee582dc4767d055d13a04860e2bec164193ed6d9008f5b80a89fb4
    prometheusConfigReloader:
      image:
        registry: registry.redhat.io
        repository: openshift4/ose-prometheus-config-reloader-rhel9
        tag: v4.20.0
        sha: 439db56f052595228d47fe82988ebec5539c48a8fe0e7480b6c184c43452a075
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
    admissionWebhooks:
      # During bootstrap, ArgoCD syncs itself and restarts its controllers
      # while other app syncs are in flight. If a PreSync hook Job completes
      # while no controller is watching, the Kubernetes TTL controller deletes
      # the Job (upstream default: 60s) before the replacement controller can
      # observe it, leaving the sync stuck indefinitely.
      # Bump to 600s to give the new controller time to come back.
      # Ref: https://github.com/argoproj/argo-cd/issues/21055
      create:
        ttlSecondsAfterFinished: 600
      patch:
        ttlSecondsAfterFinished: 600
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

  kube-state-metrics:
    image:
      registry: registry.redhat.io
      repository: openshift4/ose-kube-state-metrics-rhel9
      tag: v4.20.0
      # Subchart concatenates sha as-is; include the sha256: prefix.
      sha: sha256:78f2c2e887484c4455447ae2c1eb770bbae7946e0bcfe99366506266bf7bba91
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

  prometheus-node-exporter:
    image:
      registry: registry.redhat.io
      repository: openshift4/ose-prometheus-node-exporter-rhel9
      tag: v4.20.0
      digest: sha256:0d91bf8ba5d4261a97c465d9f9d14463c0b588204478077bed57b848bc45034b
    priorityClassName: system-node-critical
    tolerations:
      - operator: Exists
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

  prometheus:
    prometheusSpec:
      image:
        registry: registry.redhat.io
        repository: openshift4/ose-prometheus-rhel9
        tag: v4.20.0
        sha: 6ed77dd79cfce5801cc15e3efdef29498cdfe88f93e857a39cbf0e37f58f0059
      version: v3.5.0
      replicas: 2
      retention: "14d"
      retentionSize: "85GB"
      serviceMonitorSelectorNilUsesHelmValues: false
      # External labels are required for Thanos to differentiate metrics from
      # multiple clusters. These are injected by the ApplicationSet at sync time.
      externalLabels:
        cluster: '{{ required "global.cluster_name is required" .Values.global.cluster_name }}'
        cluster_type: '{{ .Values.global.cluster_type | default "regional" }}'
      remoteWrite:
        - url: http://thanos-receive-router-thanos-receive.thanos:19291/api/v1/receive
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          memory: 2Gi

      serviceMonitorNamespaceSelector: {}
      serviceMonitorSelector: {}

      podMonitorSelectorNilUsesHelmValues: false
      podMonitorNamespaceSelector: {}
      podMonitorSelector: {}

      # This prevents us from scheduling prometheus pods within the same AZ,
      # so that we have at least one zone with a replica
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus

      storageSpec:
        volumeClaimTemplate:
          metadata:
            name: prometheus-data
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 100Gi
