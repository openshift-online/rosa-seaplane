aws-load-balancer-controller:
  # clusterName and vpcId injected via ApplicationSet valuesObject
  vpcId: ""
  # Delegate webhook certificate and CA-bundle management to cert-manager.
  # Helm-generated webhook certificates are not stable across ArgoCD renders.
  enableCertManager: true
  # Allow cert-manager and External Secrets Services to be created before LBC
  # has its serving certificate; otherwise their webhooks cannot bootstrap.
  serviceMutatorWebhookConfig:
    failurePolicy: Ignore
  serviceAccount:
    create: true
    name: aws-load-balancer-controller

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    fsGroup: 65534

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
