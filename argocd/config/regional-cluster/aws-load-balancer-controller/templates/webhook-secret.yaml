{{- $controller := index .Values "aws-load-balancer-controller" }}
{{- if $controller.enableCertManager }}
# The AWS chart stops rendering its Secret when enableCertManager is true.
# Keep a metadata-only Secret in desired state so Argo doesn't prune the active
# cert during handoff; RespectIgnoreDifferences leaves /data to cert-manager.
apiVersion: v1
kind: Secret
metadata:
  name: aws-load-balancer-tls
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/tls
{{- end }}
