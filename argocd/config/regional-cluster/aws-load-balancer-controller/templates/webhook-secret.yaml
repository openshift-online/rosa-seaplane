{{- $controller := index .Values "aws-load-balancer-controller" }}
{{- if $controller.enableCertManager }}
# The AWS chart stops rendering its Secret when enableCertManager is true.
# Keep the Secret in desired state so Argo doesn't prune it during handoff.
# Kubernetes requires both TLS keys at creation; RespectIgnoreDifferences leaves
# their values to cert-manager, which replaces them after issuing the cert.
apiVersion: v1
kind: Secret
metadata:
  name: aws-load-balancer-tls
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/tls
data:
  # Kubernetes validates the required TLS keys at Secret creation. Empty values
  # are a valid placeholder; the cert-manager Certificate fills them in.
  tls.crt: ""
  tls.key: ""
{{- end }}
