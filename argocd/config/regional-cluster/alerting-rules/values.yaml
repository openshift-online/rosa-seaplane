# Injected by ApplicationSet at runtime — defaults here for helm lint only
global:
  cluster_name: ""
  aws_region: ""
  cluster_type: ""
  management_clusters: ""

sla:
  hcpAvailability:
    # 99.95% availability target — 0.05% error budget over 30 days
    target: 0.9995
  zoa:
    apiAvailability:
      # 99% starting target for internal ZOA API — tighten after baseline
      target: 0.99
    accessAvailability:
      # Access Lambda (laptop session plane) — same starting target as API
      target: 0.99
    # Boundary bridge SLI: hit / (hit+miss+error). Skipped (e2e/laptop→API) excluded from alert.
    identityBridgeHitRate:
      target: 0.95
    taSuccessRate:
      target: 0.95
