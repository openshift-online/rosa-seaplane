apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: zoa
  namespace: thanos
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/name: alerting-rules
    app.kubernetes.io/managed-by: Helm
    operator.thanos.io/prometheus-rule: "true"
spec:
  groups:
    - name: zoa-recording-rules
      rules:
        # ──────────────────────────────────────────────────────────────
        # SLI recording rules
        # ──────────────────────────────────────────────────────────────

        # YACE CloudWatch Sum/Average/Maximum stats are gauges (period window),
        # not Prometheus counters. Ratios use current-scrape sums, not rate().

        # Global weighted TA success rate (all actions aggregated).
        # Used by ZOAExecutionsTotalFailure (critical) and
        # ZOATASuccessRateBelowSLO (warning).
        - record: zoa:ta_success_rate
          expr: |
            sum by (cluster) (aws_zoa_execution_count_sum{dimension_Status="succeeded"})
            / sum by (cluster) (aws_zoa_execution_count_sum)

        # Total execution volume — traffic guard for TA alerts.
        - record: zoa:ta_total_executions
          expr: |
            sum by (cluster) (aws_zoa_execution_count_sum)

        # API availability: 1 − (5xx / total).
        # When there are no 5xx requests, the 5xx sum is empty (not zero),
        # so the division returns empty. We use `or (0 * group(...))` to
        # inject a zero-valued series with matching cluster labels.
        - record: zoa:api_availability
          expr: |
            1 - (
              (
                sum by (cluster) (aws_zoa_http_request_count_sum{dimension_HandlerMode="api", dimension_StatusClass="5xx"})
                or
                (0 * group by (cluster) (aws_zoa_http_request_count_sum{dimension_HandlerMode="api"}))
              )
              / sum by (cluster) (aws_zoa_http_request_count_sum{dimension_HandlerMode="api"})
            )

        # Access Lambda HTTP (laptop session plane). dimension_Cluster is target id or DEPLOYMENT_NAME.
        - record: zoa:access_availability
          expr: |
            1 - (
              (
                sum by (cluster) (aws_zoa_http_request_count_sum{dimension_HandlerMode="access", dimension_StatusClass="5xx"})
                or
                (0 * group by (cluster) (aws_zoa_http_request_count_sum{dimension_HandlerMode="access"}))
              )
              / sum by (cluster) (aws_zoa_http_request_count_sum{dimension_HandlerMode="access"})
            )

        # Combined ZOA Lambda invocations/errors/throttles per cluster label (api/worker
        # tag_Cluster plus Access on RC — same aggregation as Grafana ZOA Lambda SLO).
        - record: zoa:lambda_invocations_combined
          expr: |
            label_replace(
              (
                sum by (tag_Cluster) (aws_lambda_invocations_sum{dimension_FunctionName=~".*-zoa-(api|worker)", tag_Cluster!=""})
                + (
                  sum(aws_lambda_invocations_sum{dimension_FunctionName=~".*-zoa-access"})
                  or
                  (0 * sum by (tag_Cluster) (aws_lambda_invocations_sum{dimension_FunctionName=~".*-zoa-(api|worker)", tag_Cluster!=""}))
                )
              ),
              "cluster", "$1", "tag_Cluster", "(.+)"
            )

        - record: zoa:lambda_errors_combined
          expr: |
            label_replace(
              (
                sum by (tag_Cluster) (aws_lambda_errors_sum{dimension_FunctionName=~".*-zoa-(api|worker)", tag_Cluster!=""})
                + (
                  sum(aws_lambda_errors_sum{dimension_FunctionName=~".*-zoa-access"})
                  or
                  (0 * sum by (tag_Cluster) (aws_lambda_invocations_sum{dimension_FunctionName=~".*-zoa-(api|worker)", tag_Cluster!=""}))
                )
              ),
              "cluster", "$1", "tag_Cluster", "(.+)"
            )

        - record: zoa:lambda_throttles_combined
          expr: |
            label_replace(
              (
                sum by (tag_Cluster) (aws_lambda_throttles_sum{dimension_FunctionName=~".*-zoa-(api|worker)", tag_Cluster!=""})
                + (
                  sum(aws_lambda_throttles_sum{dimension_FunctionName=~".*-zoa-access"})
                  or
                  (0 * sum by (tag_Cluster) (aws_lambda_invocations_sum{dimension_FunctionName=~".*-zoa-(api|worker)", tag_Cluster!=""}))
                )
              ),
              "cluster", "$1", "tag_Cluster", "(.+)"
            )

        - record: zoa:lambda_error_rate
          expr: |
            zoa:lambda_errors_combined
            / clamp_min(zoa:lambda_invocations_combined, 1)

        - record: zoa:lambda_throttle_rate
          expr: |
            zoa:lambda_throttles_combined
            / clamp_min(zoa:lambda_invocations_combined, 1)

        # ──────────────────────────────────────────────────────────────
        # Tick health recording rules
        # ──────────────────────────────────────────────────────────────

        # Unix seconds of the last reconciler tick (EMF ReconcilerLastRun).
        # last_over_time fills gaps when YACE scrapes miss a CloudWatch period.
        - record: zoa:reconciler_last_run
          expr: |
            max by (cluster) (last_over_time(aws_zoa_reconciler_last_run_maximum[10m]))

        # Unix seconds of the last GC tick (EMF GCLastRun).
        # last_over_time is essential for GC: it fires every 5min, so YACE scrapes
        # often hit empty CloudWatch periods (nilToZero=false → gaps in Prometheus).
        # 10min lookback covers at least one GC tick.
        - record: zoa:gc_last_run
          expr: |
            max by (cluster) (last_over_time(aws_zoa_gclast_run_maximum[10m]))

        # Tick health: count of distinct values in the gap-filled recording rule.
        # Reconciler fires every 60s → expected 3-4 changes per 10m window.
        - record: zoa:reconciler_tick_count
          expr: |
            changes(zoa:reconciler_last_run[10m])

        # Tick health: count of distinct values in the gap-filled recording rule.
        # GC fires every 5min → expected 4-6 changes per 30m window.
        - record: zoa:gc_tick_count
          expr: |
            changes(zoa:gc_last_run[30m])

        - record: zoa:reaper_last_run
          expr: |
            max by (cluster) (last_over_time(aws_zoa_reaper_last_run_maximum[10m]))

        - record: zoa:reaper_tick_count
          expr: |
            changes(zoa:reaper_last_run[30m])

        # Boundary attribution SLI: share of bridge lookups that resolved operator+session.
        # Denominator excludes Outcome=skipped (laptop/CI callers). Miss/error breakdown: use
        # aws_zoa_identity_bridge_lookup_sum by dimension_Outcome on the dashboard.
        - record: zoa:identity_bridge_hit_rate
          expr: |
            sum by (cluster) (aws_zoa_identity_bridge_lookup_sum{dimension_Outcome="hit"})
            / sum by (cluster) (aws_zoa_identity_bridge_lookup_sum{dimension_Outcome=~"hit|miss|error"})

    - name: zoa-alerts
      rules:
        # ──────────────────────────────────────────────────────────────
        # CRITICAL — page oncall, ZOA operational capability is lost
        # Only 2 critical alerts: total execution failure + reconciler
        # stalled (silent async failure mode).
        # ──────────────────────────────────────────────────────────────

        # Global TA success rate near zero — any dependency failure (EKS,
        # S3, STS, networking) causes this. Backstop for scenarios where
        # Lambda itself is healthy but all TAs fail.
        # Traffic guard: >10 executions prevents false positives in quiet periods.
        - alert: ZOAExecutionsTotalFailure
          expr: |
            (zoa:ta_success_rate < 0.10)
            and
            (zoa:ta_total_executions > 10)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: ZOA executions almost completely failing
            description: >-
              ZOA on cluster {{ "{{" }} $labels.cluster {{ "}}" }} global TA success
              rate is {{ "{{" }} $value | humanizePercentage {{ "}}" }} (<10%) for 15m.
              Likely a dependency failure (EKS, S3, STS). Check dashboard
              for per-action breakdown.
            runbook: >-
              1. Open ZOA dashboard → ZOA Activity Overview and ZOA Trusted Action Executions.
              2. Check Executions by Action & Status for which actions are failing.
              3. If all kube-api scope TAs fail: EKS is likely unreachable. Check circuit breaker (ZOA Workers) and EKS health.
              4. If all aws-api scope TAs fail: STS AssumeRole is likely failing. Check IAM roles and STS regional endpoint health.
              5. If only async TAs fail: check K8s Job creation and runner image availability.
              6. If only a specific action fails: check that action RBAC and dependencies.
              7. Alert auto-recovers when success rate rises above 10%.

        # Reconciler is ZOA's heartbeat. Without it, async TA results
        # are never recorded — executions stay "running" forever in
        # DynamoDB, creating a silent failure mode invisible to
        # symptom-based alerts.
        # Three per-cluster detection paths (never use global absent()):
        #   1. No progress — tick_count == 0 despite recent raw heartbeats
        #      (covers frozen timestamps and NaN from YACE gaps)
        #   2. Valid but stale timestamp — time() - last_run > 600
        #   3. Series vanished — had heartbeats but no recent gap-filled value
        # Threshold 600s = 10× frequency (60s) absorbs pipeline delay (~5-7min).
        - alert: ZOAReconcilerStalled
          expr: |
            (
              zoa:reconciler_tick_count == 0
              and on(cluster) (count_over_time(aws_zoa_reconciler_last_run_maximum[30m]) > 5)
            )
            or
            (
              (time() - zoa:reconciler_last_run > 600)
              and (zoa:reconciler_last_run > 0)
            )
            or
            (
              max by (cluster) (count_over_time(aws_zoa_reconciler_last_run_maximum[30m])) > 5
              unless on(cluster) max by (cluster) (last_over_time(aws_zoa_reconciler_last_run_maximum[10m]))
            )
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: ZOA reconciler has stopped ticking
            description: >-
              ZOA reconciler on cluster {{ "{{" }} $labels.cluster {{ "}}" }} has not
              ticked in >10m (expected every 60s). Async TA results will
              not be recorded. Check EventBridge schedule and worker Lambda health.
            runbook: >-
              1. Check EventBridge schedule: AWS Console, EventBridge, Rules, filter by cluster ID, verify 1-minute rate schedule is enabled.
              2. Check worker Lambda health: CloudWatch, Lambda, filter by cluster, look for invocation errors or throttling.
              3. Check if Lambda can reach EKS: ZOA Workers → Circuit Breaker State Changes.
              4. If EventBridge schedule is missing, re-run the ZOA Terraform module.
              5. Alert auto-recovers when reconciler resumes ticking.

        # ──────────────────────────────────────────────────────────────
        # WARNING — needs attention, next business day / within hours.
        # ZOA is an internal SRE tool: degradation does not impact
        # customers directly. Warnings go to Slack and create tickets.
        # ──────────────────────────────────────────────────────────────

        # DLQ actively growing — Lambda invocations failing before the
        # application handler runs (OOM, init panic, AWS runtime error).
        # Uses delta() (rate of change) instead of static depth so the
        # alert auto-resolves when failures stop. The DLQ is a diagnostic
        # artifact only: execution state is in DynamoDB, and the
        # reconciler's timeoutDispatched() handles stale executions.
        # There is no redrive capability — messages cannot be re-executed.
        - alert: ZOADLQGrowing
          expr: |
            delta(sum by (cluster) (aws_sqs_approximate_number_of_messages_visible_maximum{dimension_QueueName=~".*-zoa-dlq"})[30m:]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: ZOA dead-letter queue is actively growing
            description: >-
              ZOA DLQ on cluster {{ "{{" }} $labels.cluster {{ "}}" }} gained
              {{ "{{" }} $value | humanize {{ "}}" }} messages in the last 30min.
              Lambda invocations are crashing before the handler runs.
            runbook: >-
              1. DLQ messages are raw Lambda invocation events (not re-executable). They indicate Lambda-level crashes (OOM, init panic, runtime error).
              2. Check CloudWatch Logs for the affected Lambda function for crash details.
              3. If OOM: increase memory in Terraform zoa-lambda module.
              4. If init panic: check recent image deployments, may need rollback.
              5. Execution state is in DynamoDB. The reconciler timeoutDispatched() will mark stale executions as timed_out.
              6. To clean up: AWS Console, SQS, Purge queue. Messages have no operational value beyond diagnostics.
              7. Alert auto-recovers when no new messages arrive for 30min.

        # DynamoDB is ZOA's persistence layer — sustained throttling
        # means executions and audit writes are being degraded. Human
        # action needed: check capacity and increase if required.
        - alert: ZOADynamoDBThrottled
          expr: |
            sum by (cluster, dimension_TableName) (aws_dynamodb_throttled_requests_sum{dimension_TableName=~".*-zoa-.*"}) >= 10
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: >-
              ZOA DynamoDB table
              {{ "{{" }} $labels.dimension_TableName {{ "}}" }} is being throttled
            description: >-
              DynamoDB throttles detected on table
              {{ "{{" }} $labels.dimension_TableName {{ "}}" }}
              (cluster {{ "{{" }} $labels.cluster {{ "}}" }}) for >30m.
              Execution state and audit writes may be degraded.
            runbook: >-
              1. Check the throttled table in AWS Console: DynamoDB, Tables, select the table from the alert.
              2. Check capacity mode: if provisioned, consider switching to on-demand or increasing RCU/WCU.
              3. Check for hot partitions: CloudWatch, DynamoDB, per-partition metrics.
              4. Common cause: burst of TA executions exceeding provisioned capacity.
              5. Alert auto-recovers when throttling stops.

        # Combined ZOA Lambda error rate (api + worker + Access per cluster).
        # Traffic guard: >20 invocations avoids paging on e.g. 1 error / 5 inv = 20%.
        # for: 15m matches other ZOA SLO warnings (API, TA, Access HTTP).
        - alert: ZOALambdaErrorRateHigh
          expr: |
            (zoa:lambda_error_rate > 0.05)
            and (zoa:lambda_invocations_combined > 20)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: ZOA Lambda error rate elevated
            description: >-
              ZOA Lambda functions on cluster {{ "{{" }} $labels.cluster {{ "}}" }}
              error rate is {{ "{{" }} $value | humanizePercentage {{ "}}" }} (>5%)
              for 15m. Combined API, worker, and Access invocations per cluster.
            runbook: >-
              1. Check Lambda error details in CloudWatch Logs, filter by cluster and function name (api or worker).
              2. Look for OOM kills (Runtime.ExitError), init failures, or handler panics.
              3. If OOM: increase Lambda memory in Terraform zoa-lambda module.
              4. If init panic: check recent ZOA image deployments, may need rollback.
              5. If sporadic: may be transient AWS issue, monitor for self-recovery.
              6. Alert auto-recovers when error rate drops below 5%.

        # API availability below SLO target.
        # Traffic guard: >10 requests prevents false positives when
        # e.g. 1 request fails → 0% availability.
        - alert: ZOAApiAvailabilityBelowSLO
          expr: |
            (zoa:api_availability < {{ .Values.sla.zoa.apiAvailability.target }})
            and
            (sum by (cluster) (aws_zoa_http_request_count_sum{dimension_HandlerMode="api"}) > 10)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: ZOA API availability below SLO
            description: >-
              ZOA API on cluster {{ "{{" }} $labels.cluster {{ "}}" }} availability is
              {{ "{{" }} $value | humanizePercentage {{ "}}" }}
              (target {{ .Values.sla.zoa.apiAvailability.target }}) for 15m.
            runbook: >-
              1. Check ZOA dashboard → ZOA HTTP API (API 5xx vs 4xx by Cluster, API Request Count by Route & Status).
              2. Common causes: DynamoDB issues (check throttling), Lambda memory pressure, code bugs in request handling.
              3. If correlated with ZOADynamoDBThrottled: fix DynamoDB first.
              4. If correlated with ZOALambdaErrorRateHigh: fix Lambda first.
              5. Alert auto-recovers when availability rises above {{ .Values.sla.zoa.apiAvailability.target }}.

        # Access Lambda HTTP availability (session start/join on RC).
        # EMF dimension_Cluster is deployment name, not MC id — alert is per
        # Prometheus cluster label (RC Thanos series).
        - alert: ZOAAccessAvailabilityBelowSLO
          expr: |
            (zoa:access_availability < {{ .Values.sla.zoa.accessAvailability.target }})
            and
            (sum by (cluster) (aws_zoa_http_request_count_sum{dimension_HandlerMode="access"}) > 10)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: ZOA Access availability below SLO
            description: >-
              ZOA Access on cluster {{ "{{" }} $labels.cluster {{ "}}" }} availability is
              {{ "{{" }} $value | humanizePercentage {{ "}}" }}
              (target {{ .Values.sla.zoa.accessAvailability.target }}) for 15m.
              Session plane HTTP (Function URL) is returning elevated 5xx.
            runbook: >-
              1. Open ZOA dashboard → ZOA Access & Boundary sessions HTTP API (Access HTTP panels).
              2. Check Boundary running tasks (ECS TaskCount) if session start succeeds but boundary never becomes ready.
              3. Check CloudWatch Logs for *-zoa-access Lambda (session start, RunTask, DynamoDB).
              4. Common causes: DynamoDB sessions table throttling, ECS RunTask failures, boundary task definition drift.
              5. If correlated with ZOADynamoDBThrottled: fix DynamoDB first.
              6. Alert auto-recovers when availability rises above {{ .Values.sla.zoa.accessAvailability.target }}.

        # Global TA success rate below SLO. Per-action detail is in the
        # dashboard — alerts are global to avoid noise at fleet scale
        # (40 regions × N MCs × M actions = unmanageable).
        # Traffic guard: >10 executions prevents low-traffic false positives.
        - alert: ZOATASuccessRateBelowSLO
          expr: |
            (zoa:ta_success_rate < {{ .Values.sla.zoa.taSuccessRate.target }})
            and
            (zoa:ta_total_executions > 10)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: ZOA TA success rate below SLO
            description: >-
              ZOA on cluster {{ "{{" }} $labels.cluster {{ "}}" }} global TA success
              rate is {{ "{{" }} $value | humanizePercentage {{ "}}" }}
              (target {{ .Values.sla.zoa.taSuccessRate.target }}) for 15m.
              Check dashboard for per-action breakdown.
            runbook: >-
              1. Open ZOA dashboard → ZOA Trusted Action Executions (Executions by Action & Status).
              2. Check ZOA Activity Overview by Scope (kube-api vs aws-api).
              3. If a single action is failing: check that action RBAC, timeout, and target resource availability.
              4. If many actions fail: likely a shared dependency issue, see ZOAExecutionsTotalFailure runbook.
              5. Alert auto-recovers when success rate rises above {{ .Values.sla.zoa.taSuccessRate.target }}.

        # Combined ZOA Lambda throttle rate (api + worker + Access per cluster).
        # Same traffic guard as error rate; for: 20m requires sustained throttle pressure.
        - alert: ZOALambdaThrottled
          expr: |
            (zoa:lambda_throttle_rate > 0.05)
            and (zoa:lambda_invocations_combined > 20)
          for: 20m
          labels:
            severity: warning
          annotations:
            summary: ZOA Lambda functions throttled
            description: >-
              ZOA Lambda functions on cluster {{ "{{" }} $labels.cluster {{ "}}" }}
              throttle rate is {{ "{{" }} $value | humanizePercentage {{ "}}" }} (>5%)
              for 20m. Combined API, worker, and Access invocations per cluster.
            runbook: >-
              1. Check Lambda concurrent executions in ZOA dashboard, Infrastructure: Lambda.
              2. Check AWS Console, Lambda, Configuration, Concurrency for the affected functions. ZOA uses reserved concurrency per VPC.
              3. If concurrency is too low: increase reserved concurrency in Terraform zoa-lambda module.
              4. If account-level concurrent execution limit is hit: request limit increase via AWS Support.
              5. Alert auto-recovers when throttling stops.

        # GC fires every 5min. Not immediately dangerous if stalled
        # (stale SA/RBAC accumulate, nothing breaks). Next business day.
        # Same three-path per-cluster detection as ZOAReconcilerStalled.
        # Threshold 1800s = 6× frequency (5min) absorbs pipeline delay (~10-15min).
        - alert: ZOAGCStalled
          expr: |
            (
              zoa:gc_tick_count == 0
              and on(cluster) (count_over_time(aws_zoa_gclast_run_maximum[1h]) > 3)
            )
            or
            (
              (time() - zoa:gc_last_run > 1800)
              and (zoa:gc_last_run > 0)
            )
            or
            (
              max by (cluster) (count_over_time(aws_zoa_gclast_run_maximum[1h])) > 3
              unless on(cluster) max by (cluster) (last_over_time(aws_zoa_gclast_run_maximum[30m]))
            )
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: ZOA garbage collector has stopped ticking
            description: >-
              ZOA GC on cluster {{ "{{" }} $labels.cluster {{ "}}" }} has not ticked
              in >30m (expected every 5min). Check EventBridge schedule
              and worker Lambda health.
            runbook: >-
              1. Check EventBridge schedule: AWS Console, EventBridge, Rules, filter by cluster ID, verify 5-minute rate schedule is enabled.
              2. Check worker Lambda health. GC runs inside the worker Lambda.
              3. If ZOAReconcilerStalled is also firing: the worker Lambda itself is likely broken, prioritize that alert.
              4. Impact: stale ServiceAccounts and RBAC bindings accumulate in the MC. Not immediately dangerous but creates clutter.
              5. Alert auto-recovers when GC resumes ticking.

        # Boundary identity bridge SLI: hit_rate over hit|miss|error only.
        # Outcome=skipped (Ginkgo/laptop→API) is graphed but not part of this alert.
        - alert: ZOAIdentityBridgeHitRateBelowSLO
          expr: |
            (zoa:identity_bridge_hit_rate < {{ .Values.sla.zoa.identityBridgeHitRate.target }})
            and
            (sum by (cluster) (aws_zoa_identity_bridge_lookup_sum{dimension_Outcome=~"hit|miss|error"}) > 10)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: ZOA identity bridge hit rate below SLO
            description: >-
              Identity bridge on cluster {{ "{{" }} $labels.cluster {{ "}}" }} hit rate is
              {{ "{{" }} $value | humanizePercentage {{ "}}" }}
              (target {{ .Values.sla.zoa.identityBridgeHitRate.target }}) for 15m over
              boundary lookups only (skipped/e2e excluded).
              TAs still run but audit operator may be ECS task id instead of human.
            runbook: >-
              1. Grafana → ZOA HTTP API → API Identity Bridge lookups (all outcomes).
              2. If miss/error dominate: session taskId wiring, race at start, or DynamoDB (error outcome).
              3. Alert clears when hit rate rises above {{ .Values.sla.zoa.identityBridgeHitRate.target }}.

        # Session reaper tick health (Worker route reaper, ~5m).
        - alert: ZOAReaperStalled
          expr: |
            (
              zoa:reaper_tick_count == 0
              and on(cluster) (count_over_time(aws_zoa_reaper_last_run_maximum[1h]) > 3)
            )
            or
            (
              (time() - zoa:reaper_last_run > 1800)
              and (zoa:reaper_last_run > 0)
            )
            or
            (
              max by (cluster) (count_over_time(aws_zoa_reaper_last_run_maximum[1h])) > 3
              unless on(cluster) max by (cluster) (last_over_time(aws_zoa_reaper_last_run_maximum[30m]))
            )
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: ZOA session reaper has stopped ticking
            description: >-
              ZOA reaper on cluster {{ "{{" }} $labels.cluster {{ "}}" }} has not ticked
              in >30m (expected every 5min). Boundary sessions may exceed deadline/idle policy.
            runbook: >-
              1. Check EventBridge worker schedule includes route reaper (~5m).
              2. ZOA Workers → Reaper Tick Health and Worker tick errors; check worker Lambda logs.
              3. ZOA Access & Boundary → Boundary running tasks if sessions pile up without reaper stops.
              4. Alert auto-recovers when reaper resumes ticking.

        - alert: ZOAReaperErrors
          expr: |
            sum by (cluster) (aws_zoa_reaper_errors_sum) >= 2
          for: 20m
          labels:
            severity: warning
          annotations:
            summary: ZOA session reaper errors detected
            description: >-
              ZOA session reaper on cluster {{ "{{" }} $labels.cluster {{ "}}" }}
              reported reaper phase error count >=2 in scrape window for >20m
              (5m schedule). EMF emits at most 1 phase error per tick — sustained
              high values imply repeated failed ticks in CloudWatch windows.
            runbook: >-
              1. ZOA Workers → Worker tick errors (reaper series) and worker Lambda logs.
              2. Check ECS boundary cluster health and IAM for StopTask/ListTasks on {cluster}-zoa-boundary.
              3. Alert auto-recovers when reaper errors stop.

        # GC tick errors (5m schedule) — same for window as reaper errors.
        - alert: ZOAGCErrors
          expr: |
            sum by (cluster) (aws_zoa_gcerrors_sum) >= 2
          for: 20m
          labels:
            severity: warning
          annotations:
            summary: ZOA garbage collector errors detected
            description: >-
              ZOA garbage collector on cluster {{ "{{" }} $labels.cluster {{ "}}" }}
              reported GC phase errors (>=2 in scrape window) for >20m.
              Stale ServiceAccounts and RBAC may be accumulating.
            runbook: >-
              1. Check worker Lambda logs for GC error details, filter by HandlerMode=gc.
              2. Common causes: RBAC permissions insufficient to delete resources, K8s API server temporarily unreachable, namespace stuck in terminating.
              3. Check if circuit breaker is also opening (ZOACircuitBreakerFlapping).
              4. Impact: stale resources accumulate but do not affect TA execution.
              5. Alert auto-recovers when GC errors stop.

        # Reconciler tick phase errors (1m schedule). Up to 6 phases per tick;
        # >=3 filters a single mild phase failure.
        - alert: ZOAReconcilerErrors
          expr: |
            sum by (cluster) (aws_zoa_reconciler_errors_sum) >= 3
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: ZOA reconciler phase errors detected
            description: >-
              ZOA reconciler on cluster {{ "{{" }} $labels.cluster {{ "}}" }}
              reported reconciler phase error count >=3 for >15m. Distinct from
              ZOAReconcilerStalled (tick stopped). Async state may not advance cleanly.
            runbook: >-
              1. Check worker Lambda logs for reconciler phase_errors (dispatch, poll, timeout, GC phases).
              2. If ZOAReconcilerStalled also fires: prioritize stalled (heartbeat lost).
              3. Correlate with ZOADynamoDBThrottled and ZOACircuitBreakerFlapping.
              4. Alert auto-recovers when reconciler ticks complete without phase errors.

        # Circuit breaker flapping — multiple opens in 30min means
        # sustained EKS connectivity issues on at least one Lambda container.
        - alert: ZOACircuitBreakerFlapping
          expr: |
            sum by (cluster) (increase(aws_zoa_circuit_breaker_state_change_sum{dimension_State="open"}[30m])) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: ZOA EKS circuit breaker flapping
            description: >-
              ZOA circuit breaker on cluster {{ "{{" }} $labels.cluster {{ "}}" }}
              has opened >3 times in 30min. At least one Lambda container
              is experiencing sustained EKS API connectivity issues.
            runbook: >-
              1. Circuit breaker is per Lambda container, not global. Some containers may work fine while others cannot reach EKS.
              2. Check EKS cluster health: kubectl get nodes, check API server logs.
              3. Check VPC connectivity: Lambda ENIs, security groups, NACLs.
              4. Check if EKS API server is overloaded: look for 429/503 responses.
              5. If correlated with ZOAExecutionsTotalFailure: EKS is likely the root cause.
              6. Lambda container rotation (cold starts) naturally recovers individual containers. Alert auto-recovers when EKS becomes reachable.
