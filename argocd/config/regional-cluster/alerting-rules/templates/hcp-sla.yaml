apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hcp-sla
  namespace: thanos
  annotations:
    # Prometheus Operator CRD (installed by the monitoring Application) may not exist yet when ArgoCD dry-runs this resource
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/name: alerting-rules
    app.kubernetes.io/managed-by: Helm
    operator.thanos.io/prometheus-rule: "true"
spec:
  groups:
    - name: hcp-availability-alerts
      rules:
        # Burn-rate expressions are SLO logic only. Install and delete
        # notification suppression is Alertmanager silences from the
        # hyperfleet-operator silence reconciler, matched on namespace
        # and name. HCPInstallTimeout15m stays exempt during install.
        #
        # Fast burn: detects severe outages within ~6 minutes.
        # Long window (5m) detects the problem; short window (2m)
        # confirms the issue is still active.
        - alert: HCPAvailabilityErrorBudgetFastBurn
          expr: |
            (
              (1 - avg_over_time(hcp:hostedcluster_available[5m])) > (14.4 * (1 - {{ .Values.sla.hcpAvailability.target }}))
              and
              (1 - avg_over_time(hcp:hostedcluster_available[2m])) > (14.4 * (1 - {{ .Values.sla.hcpAvailability.target }}))
            )
          for: 1m
          labels:
            severity: warning
            long_window: 5m
            short_window: 2m
          annotations:
            summary: HCP availability error budget burning fast
            description: >-
              HostedCluster {{ "{{" }} $labels.name {{ "}}" }} in namespace
              {{ "{{" }} $labels.namespace {{ "}}" }} on cluster
              {{ "{{" }} $labels.cluster {{ "}}" }} is consuming its 30-day
              availability error budget at 14.4x the sustainable rate.

        # Slow burn: detects partial degradation within ~32 minutes.
        # Long window (30m) detects the problem; short window (5m)
        # confirms the issue is still active.
        - alert: HCPAvailabilityErrorBudgetSlowBurn
          expr: |
            (
              (1 - avg_over_time(hcp:hostedcluster_available[30m])) > (6 * (1 - {{ .Values.sla.hcpAvailability.target }}))
              and
              (1 - avg_over_time(hcp:hostedcluster_available[5m])) > (6 * (1 - {{ .Values.sla.hcpAvailability.target }}))
            )
          for: 2m
          labels:
            severity: warning
            long_window: 30m
            short_window: 5m
          annotations:
            summary: HCP availability error budget burning steadily
            description: >-
              HostedCluster {{ "{{" }} $labels.name {{ "}}" }} in namespace
              {{ "{{" }} $labels.namespace {{ "}}" }} on cluster
              {{ "{{" }} $labels.cluster {{ "}}" }} is consuming its 30-day
              availability error budget at 6x the sustainable rate.
