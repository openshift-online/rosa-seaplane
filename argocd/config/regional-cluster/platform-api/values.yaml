# Default values for platform-api

global:
  git_revision: "unknown"
  aws_region: ""
  aws_account_id: ""
  management_clusters: ""

platformApi:
  # Namespace to deploy into
  namespace: platform-api

  # Service Account configuration
  serviceAccount:
    create: true
    name: platform-api-sa
    annotations: {}

  # Application configuration
  app:
    name: platform-api
    image:
      repository: quay.io/redhat-user-workloads/rosa-tenant/rosa-seaplane-api
      tag: "e6cb96b90c0618d0760c8e8f5ba3bfc248082952@sha256:fcbd03ef68ac4258424e9e4e5fe87bd18bbbe4751e289fd07ba39c023359b633"
      pullPolicy: Always

    # Application arguments
    args:
      logLevel: info
      logFormat: json
      oidcIssuerBaseURL: ""
      # Auto-delete clusters this long after creation when the caller does not
      # supply an explicit spec.expirationTimestamp. Go duration (e.g. "24h").
      # Empty = flag omitted = no default expiration (disabled).
      defaultClusterExpiration: ""
      apiPort: 8000
      healthPort: 8081
      metricsPort: 9090

    # Resources for the main app container
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # SeaplaneDB connection (pgruntime-backed Postgres)
  seaplanedb:
    secretName: seaplane-db-dsn
    secretKey: dsn

  # Deployment configuration
  deployment:
    replicas: 2

  # Service configuration
  service:
    type: ClusterIP
    ports:
      api: 8000
      health: 8081
      metrics: 9090

  # Target Group configuration
  targetGroup:
    arn: "PLACEHOLDER"
    targetType: ip

  # ServiceMonitor for Prometheus scraping
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

  # Authorization is mandatory. Caller grants belong in environment overrides.
  authz:
    # Optional serialized management config. No tables, IAM or resource grants are created.
    managementConfig: ""
    # Complete v1 bundle, delivered as text. Optional @@AWS_ACCOUNT_ID@@ and
    # @@AWS_REGION@@ markers use trusted bootstrap identity without adding grants.
    config: |
      formatVersion: 1
      registeredAccounts: []
      policies: []
      attachments: []

  # Rate Limiting configuration
  rateLimit:
    enabled: true
    redisEndpoint: ""
    config: |
      enabled: true
      redisTimeout: 20 # milliseconds — fail open faster than the 50ms code default if Valkey is degraded
      exemptAccounts: []
      default:
        rate: 20
        burst: 40
      routes:
        - path: "/api/v0/clusters"
          method: POST
          rate: 5
          burst: 10
        - path: "/api/v0/clusters"
          method: GET
          rate: 20
          burst: 40
        - path: "/api/v0/clusters/*"
          method: GET
          rate: 30
          burst: 60
        - path: "/api/v0/clusters/*"
          method: PATCH
          rate: 10
          burst: 20
        - path: "/api/v0/clusters/*"
          method: DELETE
          rate: 5
          burst: 10
        - path: "/api/v0/nodepools"
          method: POST
          rate: 10
          burst: 20
        - path: "/api/v0/nodepools"
          method: GET
          rate: 20
          burst: 40
        - path: "/api/v0/nodepools/*"
          method: GET
          rate: 30
          burst: 60
        - path: "/api/v0/nodepools/*"
          method: PATCH
          rate: 10
          burst: 20
        - path: "/api/v0/trusted-actions/*/run"
          method: POST
          rate: 20
          burst: 30

  # Health probe configuration
  probes:
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
