apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.platformApi.app.name }}
  namespace: {{ .Values.platformApi.namespace }}
  labels:
    app: {{ .Values.platformApi.app.name }}
spec:
  replicas: {{ .Values.platformApi.deployment.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.platformApi.app.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.platformApi.app.name }}
      annotations:
        checksum/authz-config: {{ include (print $.Template.BasePath "/authz-configmap.yaml") . | sha256sum }}
        {{- if .Values.platformApi.rateLimit.enabled }}
        checksum/rate-limits: {{ include (print $.Template.BasePath "/ratelimit-configmap.yaml") . | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.platformApi.serviceAccount.name }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ .Values.platformApi.app.name }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ .Values.platformApi.app.name }}
      containers:
        - name: {{ .Values.platformApi.app.name }}
          image: {{ .Values.platformApi.app.image.repository }}:{{ .Values.platformApi.app.image.tag }}
          imagePullPolicy: {{ .Values.platformApi.app.image.pullPolicy }}
          args:
            - serve
            - --log-level={{ .Values.platformApi.app.args.logLevel }}
            - --log-format={{ .Values.platformApi.app.args.logFormat }}
            - --api-port={{ .Values.platformApi.app.args.apiPort }}
            - --health-port={{ .Values.platformApi.app.args.healthPort }}
            - --metrics-port={{ .Values.platformApi.app.args.metricsPort }}
            {{- if .Values.platformApi.app.args.oidcIssuerBaseURL }}
            - --oidc-issuer-base-url={{ .Values.platformApi.app.args.oidcIssuerBaseURL }}
            {{- end }}
            {{- if .Values.platformApi.app.args.defaultClusterExpiration }}
            - --default-cluster-expiration={{ .Values.platformApi.app.args.defaultClusterExpiration }}
            {{- end }}
          env:
            - name: AWS_REGION
              value: {{ .Values.global.aws_region | quote }}
            - name: AUTHZ_CONFIG_FILE
              value: /etc/platform-api/authz/config.yaml
            # The only account that may change the temporary account allowlist.
            - name: AWS_ACCOUNT_ID
              value: {{ .Values.global.aws_account_id | quote }}
            # "id:account" pairs platform-api registers on startup.
            - name: MANAGEMENT_CLUSTERS
              value: {{ .Values.global.management_clusters | default "" | quote }}
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platformApi.seaplanedb.secretName | default "seaplane-db-dsn" }}
                  key: {{ .Values.platformApi.seaplanedb.secretKey | default "dsn" }}
            - name: MAX_REQUEST_BODY_BYTES
              value: {{ .Values.platformApi.limits.maxRequestBodyBytes | quote }}
            - name: MAX_REQUEST_HEADER_BYTES
              value: {{ .Values.platformApi.limits.maxRequestHeaderBytes | quote }}
            - name: READ_HEADER_TIMEOUT_SECONDS
              value: {{ .Values.platformApi.limits.readHeaderTimeoutSeconds | quote }}
            - name: READ_TIMEOUT_SECONDS
              value: {{ .Values.platformApi.limits.readTimeoutSeconds | quote }}
            - name: WRITE_TIMEOUT_SECONDS
              value: {{ .Values.platformApi.limits.writeTimeoutSeconds | quote }}
            - name: IDLE_TIMEOUT_SECONDS
              value: {{ .Values.platformApi.limits.idleTimeoutSeconds | quote }}
            {{- if .Values.platformApi.rateLimit.enabled }}
            - name: RATE_LIMIT_ENABLED
              value: "true"
            - name: RATE_LIMIT_CONFIG_FILE
              value: /etc/platform-api/rate-limits/limits.yaml
            - name: REDIS_ENDPOINT
              value: {{ .Values.platformApi.rateLimit.redisEndpoint | quote }}
            {{- end }}
          volumeMounts:
            - name: authz-config
              mountPath: /etc/platform-api/authz
              readOnly: true
            {{- if .Values.platformApi.rateLimit.enabled }}
            - name: rate-limits
              mountPath: /etc/platform-api/rate-limits
              readOnly: true
            {{- end }}
          ports:
            - name: api
              containerPort: {{ .Values.platformApi.app.args.apiPort }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.platformApi.app.args.healthPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.platformApi.app.args.metricsPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: {{ .Values.platformApi.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.platformApi.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.platformApi.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.platformApi.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: {{ .Values.platformApi.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.platformApi.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.platformApi.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.platformApi.probes.readiness.failureThreshold }}
          resources:
            requests:
              cpu: {{ .Values.platformApi.app.resources.requests.cpu }}
              memory: {{ .Values.platformApi.app.resources.requests.memory }}
            limits:
              cpu: {{ .Values.platformApi.app.resources.limits.cpu }}
              memory: {{ .Values.platformApi.app.resources.limits.memory }}
      volumes:
        - name: authz-config
          configMap:
            name: authz-config
            defaultMode: 0644
        {{- if .Values.platformApi.rateLimit.enabled }}
        - name: rate-limits
          configMap:
            name: rate-limits
        {{- end }}
