{{- $config := required "platformApi.authz.config is required" .Values.platformApi.authz.config -}}
{{- if contains "@@AWS_ACCOUNT_ID@@" $config -}}
  {{- $account := .Values.global.aws_account_id -}}
  {{- if or (not (kindIs "string" $account)) (not (regexMatch "^[0-9]{12}$" (toString $account))) -}}
    {{- fail "global.aws_account_id must be a runtime 12-digit account string for @@AWS_ACCOUNT_ID@@" -}}
  {{- end -}}
  {{- $config = replace "@@AWS_ACCOUNT_ID@@" $account $config -}}
{{- end -}}
{{- if contains "@@AWS_REGION@@" $config -}}
  {{- $region := .Values.global.aws_region -}}
  {{- if or (not (kindIs "string" $region)) (not (regexMatch "^[a-z]{2}(-[a-z0-9]+)+-[0-9]+$" (toString $region))) -}}
    {{- fail "global.aws_region must be a valid service region string for @@AWS_REGION@@" -}}
  {{- end -}}
  {{- $config = replace "@@AWS_REGION@@" $region $config -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: authz-config
  namespace: {{ .Values.platformApi.namespace }}
data:
  config.yaml: |
{{ $config | indent 4 }}
{{- $management := include "platform-api.managementConfig" . }}
{{- if $management }}
  management.yaml: {{ $management | quote }}
{{- end }}
