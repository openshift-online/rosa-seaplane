global:
  image_registry_account_id: ""

seaplane:
  applicationName: seaplane-operator

  namespace: argocd

  targetNamespace: seaplane

  project: default

  source:
    repoURL: https://github.com/openshift-online/rosa-seaplane-api.git
    targetRevision: 39afe3c42c918887ced80398609c3a6a608c0bfc
    path: seaplane-operator/charts

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

  helmValues:
    image:
      registry: ""
      repository: rosa-seaplane-operator
      tag: "aa468081b3e0148fccfb173dbf94a973da572ecf@sha256:339a450cf31ec048ebf61312ce102ae9cdbbb35552a183c911be70e590eda9f4"
      pullPolicy: Always

    replicaCount: 2

    serviceAccount:
      create: true
      name: seaplane-operator
      annotations: {}

    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
