# Runtime S3 settings from ApplicationSet valuesObject. Kustomize helmCharts
# cannot take that overlay, so the operand config uses ${LOKI_*} and
# -config.expand-env=true with extraEnvFrom this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: loki-s3
  namespace: {{ include "loki.namespace" . }}
  labels:
    {{- include "loki.labels" . | nindent 4 }}
  annotations:
    {{- include "loki.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  LOKI_S3_REGION: {{ .Values.loki.loki.storage.s3.region | quote }}
  LOKI_KMS_KEY_ID: {{ .Values.loki.loki.storage.s3.sse.kms_key_id | quote }}
  LOKI_CHUNKS_BUCKET: {{ .Values.loki.loki.storage.bucketNames.chunks | quote }}
  LOKI_RULER_BUCKET: {{ .Values.loki.loki.storage.bucketNames.ruler | quote }}
