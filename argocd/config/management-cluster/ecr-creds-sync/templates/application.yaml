{{- $image := index .Values "ecrCredsSync" "image" -}}
{{- $registry := index $image "registry" -}}
{{- if not $registry -}}
{{- $registry = printf "%s.dkr.ecr.us-east-1.amazonaws.com" .Values.global.image_registry_account_id -}}
{{- end -}}
{{- $childValues := deepCopy (index .Values "ecrCredsSync" "helmValues") -}}
{{- $_ := set $childValues "image" (dict
  "repository" (printf "%s/%s" $registry (index $image "repository"))
  "tag" (index $image "tag")
  "pullPolicy" (index $image "pullPolicy")) -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ index .Values "ecrCredsSync" "applicationName" }}
  namespace: {{ index .Values "ecrCredsSync" "namespace" }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ index .Values "ecrCredsSync" "project" }}

  source:
    repoURL: {{ index .Values "ecrCredsSync" "source" "repoURL" }}
    targetRevision: {{ index .Values "ecrCredsSync" "source" "targetRevision" }}
    path: {{ index .Values "ecrCredsSync" "source" "path" }}
    helm:
      values: |
        ecrCredsSync:
          {{- toYaml $childValues | nindent 10 }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ index .Values "ecrCredsSync" "targetNamespace" }}

  syncPolicy:
    {{- if index .Values "ecrCredsSync" "syncPolicy" "automated" }}
    automated:
      prune: {{ index .Values "ecrCredsSync" "syncPolicy" "automated" "prune" }}
      selfHeal: {{ index .Values "ecrCredsSync" "syncPolicy" "automated" "selfHeal" }}
    {{- end }}
    retry:
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true
