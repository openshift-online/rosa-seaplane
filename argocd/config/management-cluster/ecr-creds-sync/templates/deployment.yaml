{{- if .Values.ecrCredsSync.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecr-creds-sync
  namespace: hypershift
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecr-creds-sync
  template:
    metadata:
      labels:
        app: ecr-creds-sync
    spec:
      serviceAccountName: ecr-creds-sync
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: controller
        image: {{ .Values.ecrCredsSync.image.repository }}:{{ .Values.ecrCredsSync.image.tag }}
        imagePullPolicy: {{ .Values.ecrCredsSync.image.pullPolicy }}
        args:
        - --ecr-repository={{ .Values.ecrCredsSync.ecrRepository }}
        - --refresh-after={{ .Values.ecrCredsSync.refreshAfter }}
        {{- if .Values.ecrCredsSync.sourceSecrets }}
        - --source-secrets={{ .Values.ecrCredsSync.sourceSecrets }}
        {{- end }}
        env:
        - name: AWS_REGION
          value: {{ .Values.ecrCredsSync.awsRegion | quote }}
        ports:
        - name: health
          containerPort: 8081
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
        resources:
          requests:
            cpu: {{ .Values.ecrCredsSync.resources.requests.cpu }}
            memory: {{ .Values.ecrCredsSync.resources.requests.memory }}
          limits:
            cpu: {{ .Values.ecrCredsSync.resources.limits.cpu }}
            memory: {{ .Values.ecrCredsSync.resources.limits.memory }}
{{- end }}
