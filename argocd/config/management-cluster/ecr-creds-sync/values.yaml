global:
  image_registry_account_id: ""

ecrCredsSync:
  applicationName: ecr-creds-sync
  namespace: argocd
  targetNamespace: hypershift
  project: default

  source:
    repoURL: https://github.com/openshift-online/rosa-seaplane-ecr-creds-sync
    # Pinned commit SHA of the ecr-creds-sync chart. Update manually or via
    # Mintmaker when a new chart version is released.
    targetRevision: "630db24c37074ecb002fab0b786b8e81cf7d6d58"
    path: helm

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

  # Helm values forwarded to the child chart in rosa-seaplane-ecr-creds-sync.
  # enabled and all ECR fields are overridden per environment via the
  # ApplicationSet valuesObject — do not set sensitive values here.
  helmValues:
    enabled: false
    ecrRepository: ""
    awsRegion: ""
    sourceSecrets: ""

  image:
    # Empty uses the shared ECR account forwarded to the child chart. For a
    # Quay override, set registry to quay.io and repository to the full namespace path.
    registry: ""
    repository: rosa-seaplane-ecr-creds-sync
    tag: "f34824f"
    pullPolicy: IfNotPresent
