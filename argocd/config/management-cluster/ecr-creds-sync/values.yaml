# ecr-creds-sync environment overrides for rosa-seaplane.
# Chart defaults (image, resources, etc.) live in the canonical values.yaml in
# the rosa-seaplane-ecr-creds-sync repository. Only environment-specific
# overrides belong here.

ecrCredsSync:
  # enabled is the only env-specific override — all other values are inherited
  # from the chart defaults or supplied at runtime via ArgoCD cluster annotations
  # (ecrRepository, awsRegion, sourceSecrets).
  enabled: false
