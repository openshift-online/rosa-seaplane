ecrCredsSync:
  applicationName: ecr-creds-sync
  namespace: argocd
  targetNamespace: hypershift
  project: default

  source:
    repoURL: https://github.com/openshift-online/rosa-seaplane-ecr-creds-sync
    # Pinned commit SHA of the ecr-creds-sync chart. Update manually or via
    # Mintmaker when a new chart version is released.
    targetRevision: "bd7891a"
    path: helm

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

  # Helm values forwarded to the child chart in rosa-seaplane-ecr-creds-sync.
  # enabled and all ECR fields are overridden per environment via the
  # ApplicationSet valuesObject — do not set sensitive values here.
  helmValues:
    enabled: false
    ecrRepository: ""
    awsRegion: ""
    sourceSecrets: ""

  image:
    repository: quay.io/redhat-user-workloads/rosa-tenant/rosa-seaplane-ecr-creds-sync
    tag: "f34824f"
    pullPolicy: IfNotPresent
