# Inflate the vendored upstream cert-manager chart and patch container command.
# The RH operand image has no ENTRYPOINT, so chart args would otherwise be
# exec'd as the binary. Drop these patches if the chart grows a command value.
#
# jetstack-chart is a local wrapper chart; make helm-deps vendors its OCI
# dependency so Kustomize can render and patch it without network access.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmGlobals:
  chartHome: .
helmCharts:
  - name: jetstack-chart
    releaseName: cert-manager
    namespace: cert-manager
    includeCRDs: true
    valuesFile: jetstack-values.yaml
# helmCharts.namespace stamps metadata.namespace on the Deployments. Patches
# without that field are looked up as Deployment/...[noNs] and fail to match.
patches:
  - path: patches/controller-command.yaml
  - path: patches/webhook-command.yaml
  - path: patches/cainjector-command.yaml
