# Inflate the OpenShift cert-manager chart from the git submodule
# (openshift/cert-manager @ v1.19.6) and patch container command. The RH
# operand image has no ENTRYPOINT; the fork chart is still upstream templates
# (args, no command), so chart args would otherwise be exec'd as the binary.
# Drop these patches if the chart grows a command value.
#
# The git tree ships Chart.template.yaml, not a packaged Chart.yaml, so
# helmCharts uses jetstack-chart/ (our Chart.yaml + symlinks into the submodule).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmGlobals:
  chartHome: .
helmCharts:
  - name: jetstack-chart
    releaseName: cert-manager
    namespace: cert-manager
    includeCRDs: true
    valuesFile: jetstack-values.yaml
# helmCharts.namespace stamps metadata.namespace on the Deployments. Patches
# without that field are looked up as Deployment/...[noNs] and fail to match.
patches:
  - path: patches/controller-command.yaml
  - path: patches/webhook-command.yaml
  - path: patches/cainjector-command.yaml
