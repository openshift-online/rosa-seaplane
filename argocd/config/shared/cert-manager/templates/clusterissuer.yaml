{{- if and (eq .Values.global.cluster_type "management-cluster") .Values.global.dns_zone_operator_role_arn }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns01
  annotations:
    # CRD may not exist yet when ArgoCD dry-runs this resource
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-dns01-key
    solvers:
    - dns01:
        route53:
          region: {{ .Values.global.aws_region }}
          role: {{ .Values.global.dns_zone_operator_role_arn }}
{{- end }}
