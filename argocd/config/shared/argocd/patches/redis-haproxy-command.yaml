apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-redis-ha-haproxy
  namespace: argocd
spec:
  template:
    spec:
      containers:
        - name: haproxy
          command:
            - /usr/sbin/haproxy
          args:
            - -W
            - -db
            - -f
            - /usr/local/etc/haproxy/haproxy.cfg
