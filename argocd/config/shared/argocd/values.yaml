# Direct ArgoCD configuration
# This section will be passed to the upstream ArgoCD chart
argo-cd:
  # High Availability configuration
  ha:
    enabled: true

  global:
    priorityClassName: system-cluster-critical

  # Server configuration
  server:
    autoscaling:
      enabled: true
      minReplicas: 2
    pdb:
      enabled: true
      minAvailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: server
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: server
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  # Controller configuration
  controller:
    replicas: 2
    pdb:
      enabled: true
      minAvailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: application-controller
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: application-controller
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  # Repo Server configuration
  repoServer:
    autoscaling:
      enabled: true
      minReplicas: 2
    pdb:
      enabled: true
      minAvailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: repo-server
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: repo-server
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  # ApplicationSet controller
  applicationSet:
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  # Dex configuration
  dex:
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi

  # Notifications controller
  notifications:
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi

  # Redis HA configuration (enabled via ha.enabled=true above).
  # redis-ha is a subchart and does not inherit global.priorityClassName.
  redis-ha:
    enabled: true
    replicas: 2
    hardAntiAffinity: false
    priorityClassName: system-cluster-critical
    haproxy:
      hardAntiAffinity: false
      priorityClassName: system-cluster-critical

  # redis key kept for non-HA mode reference (unused when ha.enabled=true)
  redis:
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi

  # Redis Secret Init configuration
  redisSecretInit:
    enabled: false # Ref: https://github.com/argoproj/argo-helm/issues/2887

  # Configuration parameters
  configs:
    params:
      server.insecure: false
      # Regional ApplicationSet stages cert-manager, LBC, then workloads.
      # Set in the bootstrap chart so the feature is enabled on first reconcile.
      applicationsetcontroller.enable.progressive.syncs: "true"
      # Off by default. The MC and RC ApplicationSets enable submodules because
      # both render the Jetstack cert-manager chart from the cert-manager repo.
      reposerver.enable.git.submodule: false
    cm:
      # Keep the regional RollingSync on LBC until cert-manager has injected
      # the CA into both webhook configurations.
      "resource.customizations.health.admissionregistration.k8s.io_MutatingWebhookConfiguration": |
        local hs = { status = "Healthy", message = "" }
        if obj.metadata.name ~= "aws-load-balancer-webhook" then
          return hs
        end
        local matched = false
        for _, webhook in ipairs(obj.webhooks or {}) do
          local service = webhook.clientConfig and webhook.clientConfig.service
          if service and service.name == "aws-load-balancer-webhook-service" then
            matched = true
            local caBundle = webhook.clientConfig.caBundle
            if caBundle == nil or caBundle == "" then
              hs.status = "Progressing"
              hs.message = "Waiting for cert-manager to inject the LBC mutating webhook CA bundle"
              return hs
            end
          end
        end
        if not matched then
          hs.status = "Progressing"
          hs.message = "Waiting for LBC mutating webhook entries"
        end
        return hs
      "resource.customizations.health.admissionregistration.k8s.io_ValidatingWebhookConfiguration": |
        local hs = { status = "Healthy", message = "" }
        if obj.metadata.name ~= "aws-load-balancer-webhook" then
          return hs
        end
        local matched = false
        for _, webhook in ipairs(obj.webhooks or {}) do
          local service = webhook.clientConfig and webhook.clientConfig.service
          if service and service.name == "aws-load-balancer-webhook-service" then
            matched = true
            local caBundle = webhook.clientConfig.caBundle
            if caBundle == nil or caBundle == "" then
              hs.status = "Progressing"
              hs.message = "Waiting for cert-manager to inject the LBC validating webhook CA bundle"
              return hs
            end
          end
        end
        if not matched then
          hs.status = "Progressing"
          hs.message = "Waiting for LBC validating webhook entries"
        end
        return hs

  # SRE UI ALB — injected at runtime by ApplicationSet; empty when ALB is not deployed
  sre:
    targetGroup:
      arn: ""
