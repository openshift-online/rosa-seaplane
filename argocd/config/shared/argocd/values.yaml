# Direct ArgoCD configuration
# This section will be passed to the upstream ArgoCD chart.
#
# ROSAENG-67992: pin GitOps 1.22 images onto argo-helm 10.9.6 (appVersion v3.5.3).
# GitOps 1.22 ships Argo CD 3.5.3 / Dex 2.45.1. Chart 10.11.6 is v3.5.6 — do not
# bump past 10.9.6 until a GitOps operand matches that appVersion. GitOps
# operator is not installed on EKS. Redis stays community (redis-ha).
# Images: RHSA-2026:94584 (GitOps 1.22.3). See docs/argocd-redhat-images.md.
argo-cd:
  # High Availability configuration
  ha:
    enabled: true

  global:
    priorityClassName: system-cluster-critical
    imagePullSecrets:
      - name: pull-secret
    # Chart concatenates repository:tag. Digest from RHSA-2026:94584 (amd64).
    image:
      repository: registry.redhat.io/openshift-gitops-1/argocd-rhel9
      tag: v1.22.3@sha256:a4492e603ffa70327ac27094723819e55f2b2b038338eea8eac2e7c2f425a420

  # Server configuration
  server:
    autoscaling:
      enabled: true
      minReplicas: 2
    pdb:
      enabled: true
      minAvailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: server
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: server
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  # Controller configuration
  controller:
    replicas: 2
    pdb:
      enabled: true
      minAvailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: application-controller
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: application-controller
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  # Repo Server configuration
  repoServer:
    autoscaling:
      enabled: true
      minReplicas: 2
    pdb:
      enabled: true
      minAvailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: repo-server
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: repo-server
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  # ApplicationSet controller
  applicationSet:
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  # Dex configuration. GitOps 1.22 ships Dex 2.45.1 (matches chart 10.9.6).
  dex:
    image:
      repository: registry.redhat.io/openshift-gitops-1/dex-rhel9
      tag: v1.22.3@sha256:a6d9927bb83c40da1e1ddec30ac41e15c9c4ea98228d05e57468a4d5bd590d1b
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi

  # Notifications controller
  notifications:
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi

  # Redis HA configuration (enabled via ha.enabled=true above).
  # redis-ha is a subchart and does not inherit global.priorityClassName.
  redis-ha:
    enabled: true
    replicas: 2
    hardAntiAffinity: false
    priorityClassName: system-cluster-critical
    haproxy:
      hardAntiAffinity: false
      priorityClassName: system-cluster-critical

  # redis key kept for non-HA mode reference (unused when ha.enabled=true)
  redis:
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi

  # Redis Secret Init configuration
  redisSecretInit:
    enabled: false # Ref: https://github.com/argoproj/argo-helm/issues/2887

  # Configuration parameters
  configs:
    params:
      server.insecure: false
      # Keep first-install ArgoCD aligned with the self-managed Application.
      reposerver.enable.git.submodule: true
    cm:
      kustomize.buildOptions: --enable-helm

  # SRE UI ALB — injected at runtime by ApplicationSet; empty when ALB is not deployed
  sre:
    targetGroup:
      arn: ""
