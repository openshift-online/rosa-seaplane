# registry.redhat.io requires a pull secret. Same SSM parameter as HyperShift.
# Seeded at ECS bootstrap so the first Helm install can pull; this ExternalSecret
# refreshes it after ESO is up (creationPolicy Orphan).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pull-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: pull-secret
    creationPolicy: Orphan
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: /infra/pull-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
