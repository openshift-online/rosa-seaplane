{{- $clusterName := required "global.cluster_name must be set via ApplicationSet valuesObject" .Values.global.cluster_name -}}
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: workloads
  annotations:
    # Karpenter CRD may not exist yet when ArgoCD dry-runs this resource
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Karpenter alias doesn't support FIPS variants: https://github.com/aws/karpenter-provider-aws/issues/8198
  amiFamily: {{ if .Values.eksNodePool.ami }}{{ .Values.eksNodePool.ami.family }}{{ else }}Bottlerocket{{ end }}
  amiSelectorTerms:
    {{- if .Values.eksNodePool.ami }}
    - id: {{ .Values.eksNodePool.ami.id }}
    {{- else }}
    - name: bottlerocket-aws-k8s-1.34-fips-x86_64-*
    {{- end }}
  instanceProfile: {{ $clusterName }}-karpenter-node-role
  subnetSelectorTerms:
    - tags:
        kubernetes.io/cluster/{{ $clusterName }}: owned
  securityGroupSelectorTerms:
    - tags:
        aws:eks:cluster-name: {{ $clusterName }}
  metadataOptions:
    httpTokens: required
    httpPutResponseHopLimit: 2
  {{- if .Values.eksNodePool.ami }}
  # BIFROST-1420 workaround: rhel-bootc-eks bakes a signature-enforcing policy for
  # registry.redhat.io/redhat/*, which rejects the unsigned partner OLM catalog
  # index images (certified/community/marketplace), so their catalog pods stay in
  # Init:ImagePullBackOff. On amiFamily AL2023 Karpenter merges its generated
  # NodeConfig with this MIME doc, so we ship only a shellscript that adds per-repo
  # overrides for those three indexes; all other enforcement (incl. the signed
  # redhat-operator-index) is untouched. Remove when BIFROST-1420 lands.
  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="//"

    --//
    Content-Type: text/x-shellscript

    #!/usr/bin/env bash
    set -euo pipefail
    python3 - <<'PY'
    import json
    p = "/etc/containers/policy.json"
    d = json.load(open(p))
    d.setdefault("transports", {}).setdefault("docker", {})
    for r in ("registry.redhat.io/redhat/certified-operator-index",
              "registry.redhat.io/redhat/community-operator-index",
              "registry.redhat.io/redhat/redhat-marketplace-index"):
        d["transports"]["docker"][r] = [{"type": "insecureAcceptAnything"}]
    json.dump(d, open(p, "w"), indent=2)
    PY
    systemctl restart crio 2>/dev/null || true
    {{- if and .Values.eksNodePool.ecrMirror.enabled .Values.eksNodePool.ecrMirror.mirrors }}
    --//
    Content-Type: text/x-shellscript

    #!/usr/bin/env bash
    set -euo pipefail
    # ECR mirror config: one [[registry]] block per sourcePrefix/registryUri pair.
    # CRI-O reads drop-in files from /etc/containers/registries.conf.d/ at startup.
    # sourcePrefix and registryUri must be at the same path depth so that CRI-O
    # constructs the correct mirror URI with no path duplication.
    mkdir -p /etc/containers/registries.conf.d
    cat > /etc/containers/registries.conf.d/ecr-mirror.conf << 'CONF'
    {{- range .Values.eksNodePool.ecrMirror.mirrors }}
    [[registry]]
    prefix = "{{ .sourcePrefix }}"
    location = "{{ .sourcePrefix }}"
    mirror-by-digest-only = true

    [[registry.mirror]]
    location = "{{ .registryUri }}"
    {{ end }}
    CONF
    systemctl restart crio 2>/dev/null || true
    {{- end }}
    --//--
  # A pinned custom AMI roots at /dev/sda1, not the AL2023 default /dev/xvda, so
  # set the root mapping explicitly (mirrors the Terraform bootstrap launch
  # template in the eks-cluster module). Without it Karpenter sizes the wrong
  # device and the root stays at the AMI's baked-in size.
  blockDeviceMappings:
    - deviceName: /dev/sda1
      rootVolume: true
      ebs:
        volumeSize: {{ .Values.eksNodePool.rootVolumeSize | default "50Gi" }}
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  {{- end }}
