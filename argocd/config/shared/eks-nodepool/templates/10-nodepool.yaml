apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: workloads
  annotations:
    # Karpenter CRD may not exist yet when ArgoCD dry-runs this resource
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: workloads
      {{- with .Values.eksNodePool.expireAfter }}
      expireAfter: {{ . }}
      {{- end }}
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - {{ .Values.eksNodePool.capacityType }}
        - key: kubernetes.io/arch
          operator: In
          values:
            - {{ .Values.eksNodePool.arch }}
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            {{- range .Values.eksNodePool.instanceFamilies }}
            {{- $family := . }}
            {{- range list "large" "xlarge" "2xlarge" "4xlarge" }}
            - {{ $family }}.{{ . }}
            {{- end }}
            {{- end }}
  limits:
    cpu: {{ .Values.eksNodePool.limits.cpu | quote }}
    memory: {{ .Values.eksNodePool.limits.memory }}
  disruption:
    consolidationPolicy: {{ .Values.eksNodePool.disruption.consolidationPolicy }}
    consolidateAfter: {{ .Values.eksNodePool.disruption.consolidateAfter }}
